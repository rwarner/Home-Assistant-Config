###############################################################################
### PACKAGE - Laundry                                                       ###
###############################################################################
#
# Everything the washer/dryer monitoring needs in one file: the remaining-time
# template sensors, the announcement scripts and the nine automations that
# track and announce each machine. These were previously split across
# configuration/template/sensor/sensor_laundry.yaml,
# configuration/scripts/scripts_laundry.yaml and
# automation/rooms/laundry_room.yaml -- filed by what kind of thing each was
# rather than by what it was for. The first two held nothing but laundry and
# are gone entirely.
#
# The weekly summary that used to sit at the bottom of laundry_room.yaml did
# NOT come along. It reports energy as well as laundry and resets both
# counters, so it is a scheduled job rather than laundry-room behaviour; it
# now lives in automation/time_based/weekly.yaml.
#
###############################################################################

input_select:
  washer_activity_target:
    name: Washer Live Activity target
    icon: mdi:washing-machine
    options: [none, ryan, kelly]
  dryer_activity_target:
    name: Dryer Live Activity target
    icon: mdi:tumble-dryer
    options: [none, ryan, kelly]

template:
  - sensor:
    - name: "Washer Remaining Time"
      unique_id: washer_remaining_time
      state: >-
        {% set comp_time = as_timestamp(states('sensor.washer_washer_completion_time'), default=0) %}
        {% set delta = comp_time - as_timestamp(now()) %}
        {% set total_mins = (delta / 60) | int(0) %}
        {% if not is_state('sensor.washer_washer_machine_state', 'run') or delta <= 0 %}
          Not Running
        {% elif total_mins >= 60 %}
          {{ total_mins // 60 }} hour(s) and {{ total_mins % 60 }} minute(s)
        {% else %}
          {{ total_mins }} minute(s)
        {% endif %}

  - sensor:
    - name: "Dryer Remaining Time"
      unique_id: dryer_remaining_time
      state: >-
        {% set comp_time = as_timestamp(states('sensor.dryer_dryer_completion_time'), default=0) %}
        {% set delta = comp_time - as_timestamp(now()) %}
        {% set total_mins = (delta / 60) | int(0) %}
        {% if not is_state('sensor.dryer_dryer_machine_state', 'run') or delta <= 0 %}
          Not Running
        {% elif total_mins >= 60 %}
          {{ total_mins // 60 }} hour(s) and {{ total_mins % 60 }} minute(s)
        {% else %}
          {{ total_mins }} minute(s)
        {% endif %}

script:
  announce_washer_done:
    alias: "Announce Washer Done"
    mode: single
    sequence:
      # Finish the card rather than clearing it, matching the sprinkler and
      # outage cards. finish: 0 drops the chronometer, which frees the message
      # line for the summary. Apple expires it eight hours after the cycle
      # started, so it sits there for the rest of the day and then goes.
      #
      # This runs BEFORE the boolean is turned off: its last_changed is the
      # only record of when the cycle started, and turning it off resets that.
      # The boolean goes on five minutes into the run, so the figure is tracked
      # time rather than wall-clock, which is close enough to be useful.
      - action: script.live_activity
        data:
          target: "{{ states('input_select.washer_activity_target') }}"
          tag: washer_cycle
          title: "Washer"
          stage: "Complete"
          icon: "mdi:washing-machine"
          state: done
          finish: 0
          detail: >
            {% set secs = (now() - states.input_boolean.washer_running.last_changed)
                          .total_seconds() | int %}
            {% set h = secs // 3600 %}{% set mn = (secs % 3600) // 60 %}
            Complete · ran
            {%- if h > 0 %} {{ h }}h {{ mn }}m
            {%- else %} {{ mn }}m{% endif %}

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.washer_running
      - action: input_select.select_option
        target:
          entity_id: input_select.washer_activity_target
        data:
          option: none
      - action: script.announce_local
        data:
          message: >
            The washer is done.
            {% if is_state('sensor.dryer_dryer_machine_state', 'run') %}
              The dryer has {{ states('sensor.dryer_remaining_time') }} remaining.
            {% endif %}
      - action: counter.increment
        target:
          entity_id: counter.weekly_washer_cycles

  announce_dryer_done:
    alias: "Announce Dryer Done"
    mode: single
    sequence:
      # Finish the card rather than clearing it, matching the sprinkler and
      # outage cards. finish: 0 drops the chronometer, which frees the message
      # line for the summary. Apple expires it eight hours after the cycle
      # started, so it sits there for the rest of the day and then goes.
      #
      # This runs BEFORE the boolean is turned off: its last_changed is the
      # only record of when the cycle started, and turning it off resets that.
      # The boolean goes on five minutes into the run, so the figure is tracked
      # time rather than wall-clock, which is close enough to be useful.
      - action: script.live_activity
        data:
          target: "{{ states('input_select.dryer_activity_target') }}"
          tag: dryer_cycle
          title: "Dryer"
          stage: "Complete"
          icon: "mdi:tumble-dryer"
          state: done
          finish: 0
          detail: >
            {% set secs = (now() - states.input_boolean.dryer_running.last_changed)
                          .total_seconds() | int %}
            {% set h = secs // 3600 %}{% set mn = (secs % 3600) // 60 %}
            Complete · ran
            {%- if h > 0 %} {{ h }}h {{ mn }}m
            {%- else %} {{ mn }}m{% endif %}

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dryer_running
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_activity_target
        data:
          option: none
      - action: script.announce_local
        data:
          message: >
            The dryer is done.
            {% if is_state('sensor.washer_washer_machine_state', 'run') %}
              {% set text = states('sensor.washer_remaining_time') %}
              {% set hours = text | regex_findall('(\d+)\s*hour') %}
              {% set mins = text | regex_findall('(\d+)\s*minute') %}
              {% set total = (hours[0] | int(0) * 60 if hours else 0) + (mins[0] | int(0) if mins else 0) %}
              {% set est = (total * 1.3) | round(0) | int %}
              The washer has about {{ est }} minutes remaining.
            {% endif %}
      - action: counter.increment
        target:
          entity_id: counter.weekly_dryer_cycles

automation:
  - alias: LAUNDRY - Track washer running
    id: a1b2c3d4-laun-wash-running-trk01
    mode: restart
    trigger:
      - trigger: state
        entity_id: sensor.washer_washer_machine_state
        to: 'run'
        for:
          minutes: 5
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.washer_running

      # Decide who owns this cycle, once. Only send when it is unambiguous
      # whose laundry it is: if both are home there is no way to tell, and if
      # neither is home a Lock Screen countdown has no one to act on it.
      # Held for the whole cycle, so starting a load alone and then going out
      # keeps the stages arriving rather than freezing them at the door.
      - action: input_select.select_option
        target:
          entity_id: input_select.washer_activity_target
        data:
          option: >
            {% set r = states('sensor.ryan_status') in ['Home','Just Arrived'] %}
            {% set k = states('sensor.kelly_status') in ['Home','Just Arrived'] %}
            {{ 'ryan' if r and not k else 'kelly' if k and not r else 'none' }}

      # Kick the activity off at whatever stage the machine is already at.
      # This automation waits five minutes for `run` to settle, by which time
      # the first stage has long since fired -- without this the activity
      # would not appear until the NEXT stage change, 36 minutes into a wash.
      - condition: template
        value_template: >
          {{ states('input_select.washer_activity_target') != 'none'
             and states('sensor.washer_washer_job_state') in {'weight_sensing':'Sensing load','wash':'Washing','rinse':'Rinsing','spin':'Spinning','finish':'Finishing'} }}
      - action: script.live_activity
        data:
          target: "{{ states('input_select.washer_activity_target') }}"
          tag: washer_cycle
          title: "Washer"
          stage: >
            {{ {'weight_sensing':'Sensing load','wash':'Washing','rinse':'Rinsing','spin':'Spinning','finish':'Finishing'}[states('sensor.washer_washer_job_state')] }}
          icon: "mdi:washing-machine"
          state: running
          silent: true
          finish: >
            {{ as_timestamp(states('sensor.washer_washer_completion_time'), default=0) | int }}

  - alias: LAUNDRY - Announce washer done
    id: 98b90d3c-7815-11ee-b962-0242ac120002
    mode: single
    trigger:
      - trigger: state
        entity_id: sensor.washer_washer_machine_state
        from: 'run'
        to: 'stop'
    condition:
      - condition: state
        entity_id: input_boolean.washer_running
        state: 'on'
    action:
      - action: script.announce_washer_done

  - alias: LAUNDRY - Track dryer running
    id: a1b2c3d4-laun-dryr-running-trk01
    mode: restart
    trigger:
      - trigger: state
        entity_id: sensor.dryer_dryer_machine_state
        to: 'run'
        for:
          minutes: 5
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dryer_running

      # Decide who owns this cycle, once. Only send when it is unambiguous
      # whose laundry it is: if both are home there is no way to tell, and if
      # neither is home a Lock Screen countdown has no one to act on it.
      # Held for the whole cycle, so starting a load alone and then going out
      # keeps the stages arriving rather than freezing them at the door.
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_activity_target
        data:
          option: >
            {% set r = states('sensor.ryan_status') in ['Home','Just Arrived'] %}
            {% set k = states('sensor.kelly_status') in ['Home','Just Arrived'] %}
            {{ 'ryan' if r and not k else 'kelly' if k and not r else 'none' }}

      # Kick the activity off at whatever stage the machine is already at.
      # This automation waits five minutes for `run` to settle, by which time
      # the first stage has long since fired -- without this the activity
      # would not appear until the NEXT stage change, 36 minutes into a wash.
      - condition: template
        value_template: >
          {{ states('input_select.dryer_activity_target') != 'none'
             and states('sensor.dryer_dryer_job_state') in {'drying':'Drying','cooling':'Cooling down','finished':'Finished'} }}
      - action: script.live_activity
        data:
          target: "{{ states('input_select.dryer_activity_target') }}"
          tag: dryer_cycle
          title: "Dryer"
          stage: >
            {{ {'drying':'Drying','cooling':'Cooling down','finished':'Finished'}[states('sensor.dryer_dryer_job_state')] }}
          icon: "mdi:tumble-dryer"
          state: running
          silent: true
          finish: >
            {{ as_timestamp(states('sensor.dryer_dryer_completion_time'), default=0) | int }}

  - alias: LAUNDRY - Announce dryer done
    id: 9c564aa4-7815-11ee-b962-0242ac120002
    mode: single
    trigger:
      - trigger: state
        entity_id: sensor.dryer_dryer_machine_state
        from: 'run'
        to: 'stop'
    condition:
      - condition: state
        entity_id: input_boolean.dryer_running
        state: 'on'
    action:
      - action: script.announce_dryer_done

  - alias: LAUNDRY - Resume washer monitoring after restart
    id: a1b2c3d4-laun-wash-resume-rst01
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.washer_running
        state: 'on'
    action:
      - wait_for_trigger:
          - trigger: state
            entity_id: sensor.washer_washer_machine_state
            to: 'stop'
        timeout: "04:00:00"
        continue_on_timeout: false
      - action: script.announce_washer_done

  - alias: LAUNDRY - Resume dryer monitoring after restart
    id: a1b2c3d4-laun-dryr-resume-rst01
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.dryer_running
        state: 'on'
    action:
      - wait_for_trigger:
          - trigger: state
            entity_id: sensor.dryer_dryer_machine_state
            to: 'stop'
        timeout: "04:00:00"
        continue_on_timeout: false
      - action: script.announce_dryer_done

  - alias: LAUNDRY - Track washer recently done
    id: a1b2c3d4-laun-wash-done-track0001
    mode: restart
    trigger:
      - trigger: state
        entity_id: sensor.washer_washer_machine_state
        from: 'run'
        to: 'stop'
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.washer_recently_done
      - delay:
          minutes: 30
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.washer_recently_done

  - alias: LAUNDRY - Clear recently done when running
    id: a1b2c3d4-laun-done-clear-combined
    mode: parallel
    max_exceeded: silent
    trigger:
      - trigger: state
        entity_id: sensor.washer_washer_machine_state
        to: 'run'
        id: washer
      - trigger: state
        entity_id: sensor.dryer_dryer_machine_state
        to: 'run'
        id: dryer
    action:
      - choose:
          - conditions: "{{ trigger.id == 'washer' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.washer_recently_done
          - conditions: "{{ trigger.id == 'dryer' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.dryer_recently_done

  - alias: LAUNDRY - Track dryer recently done
    id: a1b2c3d4-laun-dryr-done-track001
    mode: restart
    trigger:
      - trigger: state
        entity_id: sensor.dryer_dryer_machine_state
        from: 'run'
        to: 'stop'
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dryer_recently_done
      - delay:
          minutes: 30
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dryer_recently_done

  - alias: LAUNDRY - Washer live activity stages
    id: a1b2c3d4-laun-wash-liveactivity01
    mode: queued
    max: 6
    trigger:
      - trigger: state
        entity_id: sensor.washer_washer_job_state
    condition:
      # Only while this machine's cycle is being tracked, and only for a stage
      # we have a name for -- this sensor also passes through none, unknown
      # and unavailable as the machine powers down.
      - condition: state
        entity_id: input_boolean.washer_running
        state: 'on'
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.washer_activity_target
            state: none
      - condition: template
        value_template: >
          {{ trigger.to_state.state in {'weight_sensing':'Sensing load','wash':'Washing','rinse':'Rinsing','spin':'Spinning','finish':'Finishing'} }}
    action:
      - action: script.live_activity
        data:
          target: "{{ states('input_select.washer_activity_target') }}"
          tag: washer_cycle
          title: "Washer"
          stage: >
            {{ {'weight_sensing':'Sensing load','wash':'Washing','rinse':'Rinsing','spin':'Spinning','finish':'Finishing'}[trigger.to_state.state] }}
          icon: "mdi:washing-machine"
          state: running
          silent: true
          finish: >
            {{ as_timestamp(states('sensor.washer_washer_completion_time'), default=0) | int }}

  - alias: LAUNDRY - Dryer live activity stages
    id: a1b2c3d4-laun-drye-liveactivity01
    mode: queued
    max: 6
    trigger:
      - trigger: state
        entity_id: sensor.dryer_dryer_job_state
    condition:
      # Only while this machine's cycle is being tracked, and only for a stage
      # we have a name for -- this sensor also passes through none, unknown
      # and unavailable as the machine powers down.
      - condition: state
        entity_id: input_boolean.dryer_running
        state: 'on'
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.dryer_activity_target
            state: none
      - condition: template
        value_template: >
          {{ trigger.to_state.state in {'drying':'Drying','cooling':'Cooling down','finished':'Finished'} }}
    action:
      - action: script.live_activity
        data:
          target: "{{ states('input_select.dryer_activity_target') }}"
          tag: dryer_cycle
          title: "Dryer"
          stage: >
            {{ {'drying':'Drying','cooling':'Cooling down','finished':'Finished'}[trigger.to_state.state] }}
          icon: "mdi:tumble-dryer"
          state: running
          silent: true
          finish: >
            {{ as_timestamp(states('sensor.dryer_dryer_completion_time'), default=0) | int }}
