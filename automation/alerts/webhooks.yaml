- alias: WEBHOOK - Synology NAS Alert
  id: synology_nas_alert
  triggers:
    - trigger: webhook
      webhook_id: synology_nas_alert
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: notify.ryan_devices
      data:
        title: "Synology NAS Alert"
        message: "{{ trigger.json.text | default('Alert received from NAS') }}"
        data:
          ttl: 0
          priority: high

