- alias: WEBHOOK - Synology NAS Alert
  id: synology_nas_alert
  triggers:
    - trigger: webhook
      webhook_id: synology_nas_alert
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: notify.ryan_devices
      data:
        title: "Synology NAS Alert"
        # DSM concatenates its webhook subject into the text field, so the
        # body arrives as "Synology NAS Alert <actual message>" and repeats
        # the title. Strip that prefix here. If DSM is ever fixed to send
        # only the message, or changes its subject, this no-ops harmlessly.
        message: >-
          {{ trigger.json.text | default('Alert received from NAS', true)
             | regex_replace('^Synology NAS Alert\s*', '') | trim }}
        data:
          ttl: 0
          priority: high

