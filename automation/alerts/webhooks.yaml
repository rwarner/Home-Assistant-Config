##############################
### ALERTS - Webhooks      ###
##############################

- alias: WEBHOOK - Sonarr Download Stuck
  id: d48dff9b-2dc7-4527-8f6d-d55944512a05
  triggers:
    - trigger: webhook
      webhook_id: sonarr_stuck
      allowed_methods:
        - POST
      local_only: true
  actions:
    - action: notify.ryan_devices
      data:
        title: "Sonarr Stuck"
        message: >
          {% set reason = namespace(parts=[]) %}
          {% for sm in trigger.json.downloadStatusMessages | default([]) %}
            {% for m in sm.messages %}
              {% set reason.parts = reason.parts + [m] %}
            {% endfor %}
          {% endfor %}
          {{ trigger.json.series.title | default('Unknown') }}: {{ reason.parts | join(', ') if reason.parts else 'Import needs manual intervention' }}

