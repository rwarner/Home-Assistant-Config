- alias: WEBHOOK - Media Maintenance Jobs
  id: 919d7a63-4121-40d6-a8e0-c5bed060c5a2
  triggers:
    - trigger: webhook
      webhook_id: media_jobs
      allowed_methods:
        - POST
      local_only: true
  actions:
    # Payload: {"job": str, "status": str, "message": str, "title": str (optional)}
    #
    # status drives WHETHER it pushes; title/message drive WHAT it says.
    #   error  -> push, "⚠️ <job> failed"      (override with "title")
    #   done   -> push, "✅ <job> complete"    (override with "title")
    #   notify -> push, title used verbatim    (free-form)
    #   other  -> logbook only, no push
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.status | default('') == 'error' }}"
          sequence:
            - action: notify.ryan_devices
              data:
                title: >
                  {{ trigger.json.title
                     | default('⚠️ ' ~ (trigger.json.job | default('Media job')) ~ ' failed', true) }}
                message: "{{ trigger.json.message | default('No detail supplied') }}"
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.status | default('') == 'done' }}"
          sequence:
            - action: notify.ryan_devices
              data:
                title: >
                  {{ trigger.json.title
                     | default('✅ ' ~ (trigger.json.job | default('Media job')) ~ ' complete', true) }}
                message: "{{ trigger.json.message | default('') }}"
                data:
                  push:
                    sound: none
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.status | default('') == 'notify' }}"
          sequence:
            - action: notify.ryan_devices
              data:
                title: "{{ trigger.json.title | default(trigger.json.job | default('Media job'), true) }}"
                message: "{{ trigger.json.message | default('') }}"
                data:
                  push:
                    sound: none
        # Live Activity statuses. A batch job knows how many items it has
        # done but cannot predict when it will finish, so these send
        # progress/progress_max and no chronometer -- the card shows a real
        # percentage bar rather than a countdown.
        #
        #   live       start or update the card
        #   live_done  finish it: bar full, green, summary on the message line
        #   live_clear end it outright
        #
        # tag is derived from the job name so each job owns one activity.
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.status | default('') in ['live', 'live_done'] }}"
          sequence:
            - action: script.live_activity
              data:
                target: ryan
                tag: "media_{{ trigger.json.job | default('job') | slugify }}"
                title: "{{ trigger.json.title | default(trigger.json.job | default('Media job'), true) }}"
                stage: "{{ trigger.json.stage | default('', true) }}"
                detail: "{{ trigger.json.message | default('', true) }}"
                icon: "{{ trigger.json.icon | default('mdi:filmstrip', true) }}"
                color: >
                  {{ '#4CAF50' if trigger.json.status == 'live_done' else '#5E5CE6' }}
                url: /new-dash/stats
                finish: 0
                progress: "{{ trigger.json.progress | default(0) | int }}"
                progress_max: "{{ trigger.json.progress_max | default(0) | int }}"
        - conditions:
            - condition: template
              value_template: "{{ trigger.json.status | default('') == 'live_clear' }}"
          sequence:
            - action: script.live_activity_clear
              data:
                tag: "media_{{ trigger.json.job | default('job') | slugify }}"
      default:
        - action: logbook.log
          data:
            name: "Media jobs"
            message: "{{ trigger.json.job | default('job') }}: {{ trigger.json.message | default('') }}"
