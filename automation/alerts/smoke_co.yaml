########################################
### ALERTS - Smoke & CO Alarms       ###
########################################

- alias: ALERT - Smoke detected, notify mobile app
  id: smoke_detected_notify
  mode: single
  trigger:
    - trigger: state
      entity_id:
        - binary_sensor.basement_smoke_co_alarm_smoke_detected
        - binary_sensor.entryway_smoke_co_alarm_smoke_detected
        - binary_sensor.second_floor_smoke_co_alarm_smoke_detected
      # No from: filter. A safety sensor reaching "on" is an alert on every
      # path, including unavailable -> on and unknown -> on. Restricting to
      # from: "off" would swallow the alarm if the device dropped off and
      # came back already triggered.
      to: "on"
  action:
    - action: script.announce_local
      data:
        message: >
          Warning! Smoke detected in the
          {{ trigger.to_state.attributes.friendly_name.split(' Smoke & CO Alarm')[0] }}.
    - action: notify.ryan_devices
      data:
        title: "🔥 Smoke Detected"
        message: >
          {{ trigger.to_state.attributes.friendly_name.split(' Smoke & CO Alarm')[0] }}
        data:
          ttl: 0
          priority: high
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
    - action: notify.kelly_devices
      data:
        title: "🔥 Smoke Detected"
        message: >
          {{ trigger.to_state.attributes.friendly_name.split(' Smoke & CO Alarm')[0] }}
        data:
          ttl: 0
          priority: high
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0

