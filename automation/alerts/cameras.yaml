################################
### ALERTS - Camera Capture  ###
################################

# Set mode to queued so that there isn't conflicting runs when called while another is running
- alias: CAMERAS - Capture on front door motion
  id: 044d29d4-7816-11ee-b962-0242ac120002
  mode: single # Only run once at a time
  max_exceeded: silent # Hide warnings when triggered while in the cooldown delay
  trigger:
    trigger: state
    entity_id:
     - input_boolean.someone_at_front_door
    to: 'on'
  condition:
    - condition: state
      entity_id: alarm_control_panel.alarm
      state: armed_away
    # Cooldown as a condition rather than a trailing delay. The delay parked a
    # run for five minutes, and mode single meant that parked run silently
    # swallowed anything else in the window -- including a genuinely separate
    # visitor. Checking last_triggered leaves the automation free.
    - condition: template
      value_template: >
        {{ this.attributes.last_triggered is none
           or (now() - this.attributes.last_triggered).total_seconds() > 300 }}
  action:
    # Waits for the script, which records, converts and posts to Discord.
    - action: script.capture_front_door_video
