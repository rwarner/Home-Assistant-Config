- alias: "ALERT - Home Assistant Successfully Started"
  id: 50cedff8-4cd9-4d85-9ea9-dc1726324335
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - action: script.announce_local
      data:
        message: "Home Assistant, online"

- alias: ALERT - Weekly HACS update digest
  id: 9c1e4d3f-2a7b-4c5e-8d6f-3b9e1a7c5d2f
  trigger:
    - trigger: time
      at: '10:00:00'
  condition:
    - condition: time
      weekday:
        - sat
    - condition: template
      value_template: >
        {{ states.update
          | selectattr('state', 'eq', 'on')
          | list | count > 0 }}
  action:
    - action: notify.ryan_devices
      data:
        title: "Updates Available"
        message: >
          {% set updates = states.update
            | selectattr('state', 'eq', 'on')
            | map(attribute='name')
            | list %}
          {{ updates | count }} update{{ 's' if updates | count > 1 else '' }} available: {{ updates | join(', ') }}
        data:
          url: "/config/updates"

- alias: ALERT - Exterior door open too long in extreme weather
  id: 7b2e4d1f-5c8a-4f3b-a2d6-9e1c5f8b3a7d
  mode: parallel
  max: 5
  max_exceeded: silent
  trigger:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_sensor
        - binary_sensor.porch_slider_sensor
        - binary_sensor.family_room_slider
        - binary_sensor.basement_door_sensor
      # "off" alone misses the first open after a sensor has sat at unknown --
      # a Z2M contact sensor has no state until it first reports, and that
      # transition is unknown -> on, which from: "off" silently swallows.
      # Deliberately NOT matching unavailable -> on: that is MQTT restoring an
      # already-open window on restart, not someone opening it.
      from:
        - "off"
        - unknown
      to: "on"
      for:
        minutes: 5
  condition:
    # Only alert in extreme weather — skip comfortable temps (45-85°F)
    - condition: or
      conditions:
        - condition: numeric_state
          entity_id: sensor.outside_avg_temp
          below: 45
        - condition: numeric_state
          entity_id: sensor.outside_avg_temp
          above: 85
  action:
    - action: script.announce_local
      data:
        message: >
          {{ trigger.to_state.attributes.friendly_name | replace(' Sensor', '') | replace(' Opening', '') }}
          has been open for 5 minutes.
          It is currently {{ states('sensor.outside_avg_temp') }} degrees outside.
    - action: notify.ryan_devices
      data:
        title: "Door Open"
        message: >
          {{ trigger.to_state.attributes.friendly_name | replace(' Sensor', '') | replace(' Opening', '') }}
          open 5 min, {{ states('sensor.outside_avg_temp') }}°F outside

