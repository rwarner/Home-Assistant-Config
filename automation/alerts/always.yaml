- alias: ALERT - UPS Power State
  id: b5af027a-ede3-4b55-9fe3-4cdca51c3c80
  mode: queued
  trigger:
    # On battery
    - trigger: template
      id: battery
      value_template: "{{ 'On Battery' in states('sensor.ups_status') }}"
      for: "00:00:30"

    # Power restored: only fire if we were previously on battery
    - trigger: state
      id: online
      entity_id: sensor.ups_status
      from: "On Battery"
      # any non-battery state, including "Online, Battery Charging" and "Online"
      for: "00:00:30"

    # Battery low while on grid power — indicates loose connection or degraded battery
    - trigger: numeric_state
      id: low_battery
      entity_id: sensor.ups_battery_charge
      below: 80
      for: "00:05:00"
  action:
    - choose:
        - conditions: "{{ trigger.id == 'battery' }}"
          sequence:
            - action: notify.ryan_devices
              data:
                title: "⚡ Home Power Outage"
                # DELIBERATELY does not use sensor.ups_battery_runtime.
                #
                # The UPS's own estimate is optimistic and has already failed us:
                # on 2026-06-07 sensor.ups_battery_charge hit 0% -- the battery
                # ran flat -- after the UPS had been advertising roughly twice the
                # runtime that actually remained. This derived figure is
                # intentionally the more conservative of the two (it currently
                # reads ~50m where the UPS claims ~110m).
                #
                # Running out of power early is the expensive failure; being told
                # you have less time than you do is not. Prefer the low estimate.
                # If you want to recalibrate, lower battery_wh -- do not swap in
                # the UPS sensor.
                message: >
                  {% set load_pct = states('sensor.ups_load') | float(1) %}
                  {% set charge_pct = states('sensor.ups_battery_charge') | float(0) %}
                  {% set battery_wh = 188 %}
                  {% set ups_rated_w = 1320 %}
                  {# floor at 1W so a zero/absent load reading cannot divide by zero #}
                  {% set actual_w = [((load_pct / 100) * ups_rated_w), 1] | max %}
                  {% set est_min = ((charge_pct / 100 * battery_wh) / actual_w * 60) | round(0) | int %}
                  Battery: {{ charge_pct | round(0) }}% · Load: {{ actual_w | round(0) }}W ({{ load_pct | round(0) }}%)
                  Est. runtime: ~{% if est_min >= 60 %}{{ est_min // 60 }}h {{ est_min % 60 }}m{% else %}{{ est_min }}m{% endif %}
        - conditions: "{{ trigger.id == 'online' }}"
          sequence:
            - action: notify.ryan_devices
              data:
                title: "✅ Home Power Restored"
                # Outage length is measured from when the UPS entered "On Battery"
                # to when it left it, so the trigger's 30s debounce is excluded.
                # Note: if an outage outlasts the UPS, HA is down for the tail of
                # it and this fires only if HA is back before the state clears.
                message: >
                  {% set secs = (trigger.to_state.last_changed
                                 - trigger.from_state.last_changed).total_seconds() | int %}
                  {% set h = secs // 3600 %}
                  {% set m = (secs % 3600) // 60 %}
                  Power was out for
                  {%- if h > 0 %} {{ h }}h {{ m }}m
                  {%- elif m > 0 %} {{ m }}m
                  {%- else %} {{ secs }}s
                  {%- endif %}.
                  Battery now {{ states('sensor.ups_battery_charge') | float(0) | round(0) }}%.

        - conditions: "{{ trigger.id == 'low_battery' }}"
          sequence:
            - action: notify.ryan_devices
              data:
                title: "⚠️ UPS Battery Low"
                message: >
                  {% set charge_pct = states('sensor.ups_battery_charge') | float(0) %}
                  {% set status = states('sensor.ups_status') %}
                  Battery at {{ charge_pct | round(0) }}% while {{ status }}.
                  May indicate a loose connection or degraded battery cell.
                data:
                  ttl: 0
                  priority: high

- alias: ALERT - Low battery on sensor, notify Mobile App
  id: 3c4cf9b0-7814-11ee-b962-0242ac120002
  mode: single
  trigger:
    - trigger: template
      value_template: >
        {% set ns = namespace(low_batt=[]) %}
        {% for entity in expand(label_entities("Monitor Battery Level")) %}
          {% if entity.state | float(0) < 30 and entity.state | float(0) > 0 %}
            {% set ns.low_batt = ns.low_batt + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.low_batt | count > 0 }}
  condition: []
  action:
    - action: notify.ryan_devices
      data:
        title: "Low Battery Alert"
        message: >
          {% set ns = namespace(low_batt=[]) %}
          {% for entity in expand(label_entities("Monitor Battery Level")) %}
            {% if entity.state | float(0) < 30 and entity.state | float(0) > 0 %}
              {% set ns.low_batt = ns.low_batt + [entity] %}
            {% endif %}
          {% endfor %}
          {{ ns.low_batt | count }} sensor(s) need batteries: {{ ns.low_batt | map(attribute='name') | join(', ') }}
        data:
          url: /lovelace/devices_view

- alias: ALERT - Battery Sensors Unavailable, Notify Mobile App
  id: 43a40884-7814-11ee-b962-0242ac120002
  mode: single
  trigger:
    # Trigger whenever the computed count sensor changes.
    # The "for" ensures the NEW state (count) is stable for 5 minutes before firing.
    - trigger: state
      entity_id: sensor.unavailable_battery_count
      for:
        minutes: 5
  variables:
    # Convert state strings to ints safely
    to_count: "{{ trigger.to_state.state | int(0) }}"
    from_count: "{{ trigger.from_state.state | int(0) if trigger.from_state else 0 }}"
    # Grab the current list of unavailable names from the sensor attributes
    unavailable_names: "{{ state_attr('sensor.unavailable_battery_count', 'names') or [] }}"
    unavailable_entity_ids: "{{ state_attr('sensor.unavailable_battery_count', 'entity_ids') or [] }}"
  condition:
    # 1) Do nothing if the new count is 0 (this is your "avoid when we return to 0")
    - condition: template
      value_template: "{{ to_count > 0 }}"

    # 2) Only notify when the count INCREASES (e.g., another device went unavailable)
    #    This prevents spam when it stays the same or decreases.
    - condition: template
      value_template: "{{ to_count > from_count }}"
  action:
    - action: notify.ryan_devices
      data:
        title: "Devices Unavailable"
        message: >
          {{ to_count }} device(s) unavailable:
          {{ unavailable_names | join(', ') }}
        data:
          url: /lovelace/devices_view
          ttl: 0
          priority: high


- alias: ALERT - Notify when the physical mail comes
  id: 48cfaaa2-7814-11ee-b962-0242ac120002
  trigger:
    - trigger: state
      entity_id: binary_sensor.mailbox_sensor_vibration
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.mail_arrived
      state: "off"
  action:
    - action: notify.ryan_devices
      data:
        # UTF-8 issue as of 2022.8
        #title: "\uD83D\uDCEB\uD83D\uDCEB  Mail has arrived  \uD83D\uDCEB\uD83D\uDCEB"
        title: Mail has arrived
        message: ""
    - action: script.announce_local
      data:
        message: "You've got mail"
    - action: homeassistant.turn_on
      entity_id: input_boolean.mail_arrived

- alias: ALERT - Water detected on moisture sensor, notify mobile app
  id: 4db93146-7814-11ee-b962-0242ac120002
  trigger:
    - trigger: state
      entity_id:
        - binary_sensor.downstairs_bathroom_water_sensor_water_leak
        - binary_sensor.kitchen_water_sensor_moisture
        - binary_sensor.laundry_water_sensor_water_leak
        - binary_sensor.half_bath_water_sensor_water_leak
        - binary_sensor.upstairs_bathroom_water_sensor_water_leak
      # No from: filter. A safety sensor reaching "on" is an alert on every
      # path, including unavailable -> on and unknown -> on. Restricting to
      # from: "off" would swallow the alarm if the device dropped off and
      # came back already triggered.
      to: "on"
  action:
    - action: script.announce_local
      data:
        message: "Water detected: {{ trigger.to_state.attributes.friendly_name }}"
    - action: notify.ryan_devices
      data:
        title: "💧 Water Detected"
        message: "{{ trigger.to_state.attributes.friendly_name }}"
        data:
          ttl: 0
          priority: high
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
    - action: notify.kelly_devices
      data:
        title: "💧 Water Detected"
        message: "{{ trigger.to_state.attributes.friendly_name }}"
        data:
          ttl: 0
          priority: high
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0



- alias: ALERT - Rain Bird integration unavailable, notify mobile app
  id: rainbird_integration_unavailable
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.rain_bird_controller_rainsensor
      to: "unavailable"
      for:
        hours: 1
  action:
    - action: notify.ryan_devices
      data:
        title: "Rain Bird Offline"
        message: "Rain Bird controller has been unavailable for over an hour. Sprinklers will not run until it recovers."
        data:
          ttl: 0
          priority: high
          url: /config/integrations/integration/rainbird

- alias: ALERT - Rain Bird integration recovered, notify mobile app
  id: rainbird_integration_recovered
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.rain_bird_controller_rainsensor
      from: "unavailable"
      not_to: "unavailable"
  condition:
    - condition: template
      value_template: >
        {{ (now() - trigger.from_state.last_changed).total_seconds() > 3600 }}
  action:
    - action: notify.ryan_devices
      data:
        title: "Rain Bird Back Online"
        message: "Rain Bird controller has reconnected."

