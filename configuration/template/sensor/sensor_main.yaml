################################
### TEMPLATE - Main Sensors  ###
################################

- sensor:

# Harmony Remote sensor for current activity
  - name: Media Room
    unique_id: harmony_hub_activity
    state: '{{ state_attr("remote.harmony_hub", "current_activity") }}'

  - name: "Sonarr Upcoming Shows"
    unique_id: sonarr_upcoming_shows
    state: >
      {% set cal = states('sensor.sonarr_calendar') %}
      {% if cal not in ['unknown', 'unavailable', ''] and '|' in cal %}
        {% set ns = namespace(lines=[]) %}
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
        {% for entry in cal.split('||') %}
          {% set parts = entry.strip().split('|') %}
          {% if parts | length >= 3 %}
            {% set ep_date = parts[0] %}
            {% set title = parts[1] %}
            {% set code = parts[2] %}
            {% if ep_date == today %}
              {% set day_label = 'Tonight' %}
            {% elif ep_date == tomorrow %}
              {% set day_label = 'Tomorrow' %}
            {% else %}
              {% set day_label = as_datetime(ep_date + 'T12:00:00').strftime('%A') %}
            {% endif %}
            {% set ns.lines = ns.lines + ['- ' + day_label + ' — ' + title + ' · ' + code] %}
          {% endif %}
        {% endfor %}
        {{ ns.lines | join('\n') if ns.lines else 'No upcoming shows' }}
      {% else %}
        No upcoming shows
      {% endif %}
    attributes:
      show_count: >
        {% set cal = states('sensor.sonarr_calendar') %}
        {% if cal not in ['unknown', 'unavailable', ''] and '|' in cal %}
          {{ cal.split('||') | length }}
        {% else %}
          0
        {% endif %}


  - name: "Unavailable Battery Count"
    unique_id: unavailable_battery_count
    state: >
      {{ expand(label_entities("Monitor Battery Level"))
          | selectattr('state','eq','unavailable')
          | list | count }}
    attributes:
      names: >
        {{ expand(label_entities("Monitor Battery Level"))
            | selectattr('state','eq','unavailable')
            | map(attribute='name')
            | list }}
      entity_ids: >
        {{ expand(label_entities("Monitor Battery Level"))
            | selectattr('state','eq','unavailable')
            | map(attribute='entity_id')
            | list }}

  # Conservative UPS runtime estimate, in minutes.
  #
  # DELIBERATELY not sensor.ups_battery_runtime. The UPS's own estimate is
  # optimistic and has already failed us: on 2026-06-07 sensor.ups_battery_charge
  # hit 0% -- the battery ran flat -- after the UPS had been advertising roughly
  # twice the runtime that actually remained. This derived figure is
  # intentionally the more conservative of the two (it reads ~50m where the UPS
  # claims ~110m).
  #
  # Running out of power early is the expensive failure; being told you have
  # less time than you do is not. Prefer the low estimate. To recalibrate,
  # lower battery_wh -- do NOT swap in the UPS sensor.
  #
  # Lives here as a sensor rather than inline in the outage alert so the alert
  # and the Live Activity countdown cannot drift apart when it is recalibrated.
  - name: "UPS Estimated Runtime"
    unique_id: ups_estimated_runtime
    unit_of_measurement: "min"
    device_class: duration
    state: >
      {% set load_pct = states('sensor.ups_load') | float(1) %}
      {% set charge_pct = states('sensor.ups_battery_charge') | float(0) %}
      {% set battery_wh = 188 %}
      {% set ups_rated_w = 1320 %}
      {# floor at 1W so a zero/absent load reading cannot divide by zero #}
      {% set actual_w = [((load_pct / 100) * ups_rated_w), 1] | max %}
      {{ ((charge_pct / 100 * battery_wh) / actual_w * 60) | round(0) | int }}

