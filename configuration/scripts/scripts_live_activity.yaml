######################################
### SCRIPTS - Live Activity        ###
######################################
#
# One sender for every iOS Live Activity in the config. Kept out of any single
# feature package because laundry, sprinklers and the UPS all use it.
#
# What the fields actually do on iOS, which the companion docs only spell out
# in a tip under "Payload anatomy":
#
#   * chronometer TAKES OVER the message line. Text put in `message` is
#     invisible while a countdown runs, so the changing text goes in
#     `critical_text` (top right on the Lock Screen, and always shown in the
#     Dynamic Island compact view). `message` still carries it for after the
#     countdown expires.
#   * progress / progress_max REPLACE critical_text in that corner with a
#     percentage. Countdown-style callers leave them unset so the stage keeps
#     that slot and the chronometer draws its own bar. Batch-style callers --
#     the media cron jobs, which know how many items are done but cannot
#     predict an end time -- set them INSTEAD of finish, and get a real
#     progress bar. Setting both is allowed but pointless: the percentage
#     wins the corner and the stage is lost.
#   * progress_bar_direction is deliberately NOT set, so the bar keeps the
#     documented default for a countdown timer and drains toward empty. Every
#     activity here is a countdown, and a bar travelling the opposite way to
#     the number beside it reads wrong. `increasing` would suit a job whose
#     bar should fill as it completes; it is plainly wrong for the UPS, where
#     nothing is completing and the bar represents runtime left.
#   * title is static; updates cannot change it.
#
# `when` + `chronometer` hand the finish time over once and the phone counts
# down on its own, so a caller only has to send on real state changes. The docs
# warn that iOS throttles activities updated every second or driven by a
# frequently changing entity.

live_activity:
  alias: "Live Activity"
  mode: parallel
  max: 10
  fields:
    target: {description: "ryan, kelly, both or none"}
    tag: {description: "Activity tag, reused to update it in place"}
    title: {description: "Static header -- cannot change once started"}
    stage: {description: "Short changing text, e.g. the current stage"}
    detail: {description: "Optional longer body text; falls back to stage. Only visible once the countdown is gone, since chronometer takes over the message line"}
    icon: {description: "mdi slug"}
    color: {description: "Hex colour for the icon and progress bar"}
    finish: {description: "Unix timestamp the job ends, 0 if unknown"}
    progress: {description: "Optional current progress, e.g. items done. Use INSTEAD of finish for a batch with no reliable ETA"}
    progress_max: {description: "Optional total; a bar and percentage appear when both are set"}
    url: {description: "Optional path to open when the card is tapped"}
  sequence:
    - variables:
        payload: >
          {% set base = {'tag': tag, 'live_update': true,
                         'critical_text': stage,
                         'notification_icon': icon,
                         'notification_icon_color': color,
                         'url': url | default('/new-dash/home', true)} %}
          {# every optional field needs `default` before a filter: HA's Jinja is
             strict about undefined NAMES, and `| int(0)` only supplies a
             fallback for a bad VALUE, not for a variable that was never passed #}
          {% set fin = finish | default(0) | int %}
          {% set pmax = progress_max | default(0) | int %}
          {% set timed = dict(base, chronometer=true, when=fin)
             if fin > (now() | as_timestamp | int) else base %}
          {{ dict(timed, progress=progress | default(0) | int, progress_max=pmax)
             if pmax > 0 else timed }}
    - if: "{{ target in ['ryan', 'both'] }}"
      then:
        - action: notify.mobile_app_ryans_iphone_13_mini
          data:
            title: "{{ title }}"
            message: "{{ detail | default(stage, true) }}"
            data: "{{ payload }}"
    - if: "{{ target in ['kelly', 'both'] }}"
      then:
        - action: notify.mobile_app_kellys_iphone_15_pro_max
          data:
            title: "{{ title }}"
            message: "{{ detail | default(stage, true) }}"
            data: "{{ payload }}"

live_activity_clear:
  alias: "Live Activity Clear"
  mode: parallel
  max: 10
  fields:
    tag: {description: "Activity tag to end"}
  sequence:
    # Always clear BOTH phones whoever owns the activity. Ownership is decided
    # when a job starts, so the owner may well have left by the time it ends;
    # clearing only the current occupant would strand their card until Apple
    # expires it eight hours later. Clearing one that never started is a no-op.
    - parallel:
        - action: notify.mobile_app_ryans_iphone_13_mini
          data:
            message: clear_notification
            data:
              tag: "{{ tag }}"
        - action: notify.mobile_app_kellys_iphone_15_pro_max
          data:
            message: clear_notification
            data:
              tag: "{{ tag }}"
