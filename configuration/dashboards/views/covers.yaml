title: Covers
path: covers
icon: mdi:blinds-horizontal-closed

cards:
  - type: vertical-stack
    cards:

      - type: custom:mushroom-cover-card
        entity: cover.living_room_shades
        name: Living Room
        icon: mdi:blinds-horizontal
        show_position_control: false
        show_buttons_control: true

      - type: custom:mushroom-cover-card
        entity: cover.kitchen_window_shade_cover
        name: Kitchen
        icon: mdi:blinds-horizontal
        show_position_control: false
        show_buttons_control: true

      - type: custom:mushroom-cover-card
        entity: cover.family_room_shades
        name: Family Room
        icon: mdi:blinds-horizontal
        show_position_control: false
        show_buttons_control: true

      - type: custom:mushroom-cover-card
        entity: cover.ryans_office_shades
        name: Ryan's Office
        icon: mdi:blinds-horizontal
        show_position_control: false
        show_buttons_control: true

      # Spacer for bottom nav clearance
      - type: custom:button-card
        color_type: blank-card
        card_mod:
          style: |
            ha-card { height: 80px; background: none !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

      - !include ../cards/bottom-nav-bar.yaml
