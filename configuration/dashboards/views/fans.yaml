title: Fans
path: fans
icon: mdi:fan

cards:
  - type: vertical-stack
    cards:
      - type: entities
        entities:
          - entity: switch.master_bedroom_fan
            name: Master Bedroom Fan
            icon: mdi:fan

      - type: entities
        title: Kitchen Air Purifier
        icon: mdi:air-purifier
        entity: fan.core_400s_series
        show_header_toggle: true
        entities:
          - type: custom:fan-percent-button-row
            entity: fan.core_400s_series
            name: Speed
            customSetpoints: true
            lowPercentage: 25
            medPercentage: 50
            hiPercentage: 75
            hideOff: true
          - type: button
            name: Auto
            icon: mdi:fan-auto
            tap_action:
              action: call-service
              service: fan.set_preset_mode
              target:
                entity_id: fan.core_400s_series
              data:
                preset_mode: auto
          - entity: sensor.core_400s_series_pm2_5
            name: Air Quality (PM2.5)
            icon: mdi:air-filter

      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Attic Gable Fan
            secondary: >
              {{ states('sensor.attic_gable_fan_temperature') }}°F ·
              {{ states('sensor.attic_gable_fan_humidity') }}% RH ·
              {% if is_state('fan.attic_gable_fan', 'on') %}{{ states('sensor.attic_gable_fan_fan_speed') }}{% else %}Off{% endif %}
            icon: >
              {% if is_state('fan.attic_gable_fan', 'on') %}mdi:fan{% else %}mdi:fan-off{% endif %}
            icon_color: >
              {% set t = states('sensor.attic_gable_fan_temperature') | float(80) %}
              {% if not is_state('fan.attic_gable_fan', 'on') %}#555555
              {% elif t > 110 %}red
              {% elif t > 95 %}orange
              {% else %}#30d158
              {% endif %}
            badge_icon: >
              {% if is_state('fan.attic_gable_fan', 'on') %}mdi:check-circle{% endif %}
            badge_color: "#30d158"
            tap_action:
              action: toggle
              entity: fan.attic_gable_fan
            card_mod:
              class: plain

          - type: entities
            show_header_toggle: false
            card_mod:
              style: |
                ha-card { background: none !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
            entities:
              - entity: fan.attic_gable_fan
                name: Power
                icon: mdi:power
              - type: section
                label: Attic Conditions
              - entity: sensor.attic_gable_fan_fan_speed
                name: Fan Speed
                icon: mdi:speedometer
              - entity: sensor.attic_gable_fan_temperature
                name: Temperature
                icon: mdi:thermometer
              - entity: sensor.attic_gable_fan_humidity
                name: Humidity
                icon: mdi:water-percent
              - type: section
                label: Temperature Thresholds
              - entity: number.attic_gable_fan_high_temp_threshold
                name: High
                icon: mdi:thermometer-high
              - entity: number.attic_gable_fan_medium_temp_threshold
                name: Medium
                icon: mdi:thermometer
              - entity: number.attic_gable_fan_low_temp_threshold
                name: Low
                icon: mdi:thermometer-low

      # Spacer for bottom nav clearance
      - type: custom:button-card
        color_type: blank-card
        card_mod:
          style: |
            ha-card { height: 80px; background: none !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

      - !include ../cards/bottom-nav-bar.yaml
