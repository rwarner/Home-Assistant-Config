kiosk_mode:
  hide_header: true

# Custom template for button cards
# https://github.com/custom-cards/button-card
button_card_templates:
  nav_bar_icons:
    styles:
        icon:
          - width: 26px
          - height: 26px
          - color: >
              [[[
                return window.location.pathname.includes(variables.path)
                  ? "#30d158"
                  : "rgba(255,255,255,0.65)";
              ]]]
          - filter: >
              [[[
                return window.location.pathname.includes(variables.path)
                  ? "drop-shadow(0 0 6px rgba(48, 209, 88, 0.5))"
                  : "none";
              ]]]
        img_cell:
          - display: flex
          - align-items: center
          - justify-content: center
        card:
          # Read by :host(.nav-btn) in the theme. Setting `background`
          # directly here does nothing -- button-card applies styles.card as
          # an inline style, which loses to the theme's !important rule.
          - --nav-active-bg: >
              [[[
                return window.location.pathname.includes(variables.path)
                  ? "rgba(255,255,255,0.10)"
                  : "transparent";
              ]]]
          - border-radius: 16px
          - padding: 6px
          - width: 60px
          - border: none
          - box-shadow: none
        name:
          - color: rgba(255,255,255,0.75)
          - font-size: 11px
          - font-weight: 500
          - padding-top: 4px

views:
  - !include views/home.yaml

  - !include views/cameras.yaml
  - !include views/climate.yaml
  - !include views/covers.yaml
  - !include views/lights.yaml
  - !include views/fans.yaml
  - !include views/media.yaml
  - !include views/security.yaml
  - !include views/stats.yaml
  - !include views/solar.yaml
  - !include views/pool.yaml
  - !include views/sprinklers.yaml
  - !include views/more.yaml
