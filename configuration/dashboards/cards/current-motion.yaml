type: custom:auto-entities
show_empty: false
card:
  type: custom:vertical-stack-in-card
card_param: cards
filter:
  include:
    - entity_id: binary_sensor.*motion_sensor
      state: 'on'
      options:
        type: custom:mushroom-template-card
        primary: "{{ state_attr(entity, 'friendly_name') | replace(' Motion Sensor', '') | replace(' Sensor', '') }}"
        secondary: "Motion Detected"
        icon: mdi:motion-sensor
        icon_color: amber
        card_mod:
          class: plain
  exclude:
    - entity_id: binary_sensor.motion_camera_doorbell
    - entity_id: binary_sensor.undercabinet_motion_sensor
