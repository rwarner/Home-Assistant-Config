type: conditional
conditions:
  - condition: numeric_state
    entity: sensor.sonarr_upcoming
    above: 0
  - condition: state
    entity: sensor.sonarr_upcoming_shows
    state_not: unknown
  - condition: state
    entity: sensor.sonarr_upcoming_shows
    state_not: unavailable
  - condition: state
    entity: sensor.sonarr_upcoming_shows
    state_not: "No upcoming shows"
card:
  type: custom:vertical-stack-in-card
  cards:
    - type: custom:mushroom-template-card
      primary: >
        {{ state_attr('sensor.plex_server_library_movies', 'last_added_item') }}
      secondary: >
        {% set ts = state_attr('sensor.plex_server_library_movies', 'last_added_timestamp') %}
        {{ 'Added ' + (ts | as_datetime | as_local).strftime('%B %d, %Y') if ts else '' }}
      icon: mdi:filmstrip
      icon_color: red
      card_mod:
        style: |
          ha-card { background: none !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    - type: markdown
      card_mod:
        style: |
          ha-card {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            padding-top: 0 !important;
            font-size: 13px;
          }
          ha-markdown {
            padding: 0 16px 8px !important;
          }
      content: |
        **Upcoming Shows**

        {{ states('sensor.sonarr_upcoming_shows') }}
