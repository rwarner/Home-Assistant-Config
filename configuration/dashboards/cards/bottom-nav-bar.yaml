type: custom:mod-card
card_mod:
  style: |
    ha-card {
      position: fixed;
      z-index: 999;
      height: 60px;
      padding: 0;
      border-radius: 20px;

      background: rgba(20, 20, 25, 0.55);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);

      box-shadow:
        0 -2px 8px rgba(0, 0, 0, 0.25),
        0 -12px 24px rgba(0, 0, 0, 0.35);

      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.1) !important;

      overflow: hidden;
    }

    /* Mobile: simple left/right */
    @media (max-width: 767px) {
      ha-card {
        left: 8px;
        right: 8px;
        width: auto;
        transform: none;
        bottom: calc(env(safe-area-inset-bottom));
      }
    }

    /* Desktop: content-area centered */
    @media (min-width: 768px) {
      ha-card {
        left: calc(50% + (var(--mdc-drawer-width, 0px) / 2));
        transform: translateX(-50%);
        width: min(720px, calc(100vw - var(--mdc-drawer-width, 0px) - 16px));
        bottom: calc(env(safe-area-inset-bottom) + 16px);
      }
    }

card:
  type: grid
  square: false
  columns: 6
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  style:
    z-index: 10
  cards:
    - type: custom:button-card
