type: custom:mod-card
card_mod:
  style: |
    ha-card {
      position: fixed;
      z-index: 999;
      /* 64 rather than 60 so the active pill clears the bar's edges instead
         of being sliced flat by overflow: hidden. The grid top-aligns its
         cells, so the leftover room all collected at the bottom and the pill
         sat flush against the top border -- the 4px top padding moves it down
         into that slack. Buttons themselves are untouched. */
      height: 64px;
      padding: 4px 8px 0;
      overflow: hidden;

      /* Everything below MUST be !important. The theme's global ha-card rule
         marks background, border, border-radius and box-shadow !important at
         the same specificity, so anything unmarked here is silently dropped
         and the bar renders as an ordinary card. */

      /* Capsule -- exactly half the height, like Apple's floating tab bar. */
      border-radius: 32px !important;

      /* Tint plus a sheen falling off toward the bottom, sitting on top of
         the blurred backdrop rather than replacing it. */
      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.13) 0%,
          rgba(255, 255, 255, 0.05) 45%,
          rgba(255, 255, 255, 0.00) 100%
        ),
        rgba(20, 20, 25, 0.50) !important;

      /* Heavier saturation is most of what separates Apple's glass from a
         plain blur -- colour behind the bar stays vivid instead of washing
         out. Real refraction needs an SVG feDisplacementMap fed into
         backdrop-filter, which only Chromium supports, so it is left out
         rather than rendering differently on the phone and the tablet. */
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;

      /* Specular rim: a lit top edge, a faint return along the bottom, then
         one soft ambient shadow instead of two heavy upward-cast ones. */
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1px 0 rgba(255, 255, 255, 0.07),
        0 8px 32px rgba(0, 0, 0, 0.38) !important;

      border: 1px solid rgba(255, 255, 255, 0.12) !important;
    }

    /* Mobile: simple left/right */
    @media (max-width: 767px) {
      ha-card {
        left: 8px;
        right: 8px;
        width: auto;
        transform: none;
        bottom: calc(env(safe-area-inset-bottom));
      }
    }

    /* Desktop: content-area centered */
    @media (min-width: 768px) {
      ha-card {
        left: calc(50% + (var(--mdc-drawer-width, 0px) / 2));
        transform: translateX(-50%);
        width: min(720px, calc(100vw - var(--mdc-drawer-width, 0px) - 16px));
        bottom: calc(env(safe-area-inset-bottom) + 16px);
      }
    }

card:
  type: grid
  square: false
  columns: 6
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  style:
    z-index: 10
  cards:
    - type: custom:button-card
      template: nav_bar_icons
      icon: mdi:home
      name: Home
      variables:
        path: /new-dash/home
      tap_action:
        action: navigate
        navigation_path: /new-dash/home
      card_mod:
        class: nav-btn

    - type: custom:button-card
      template: nav_bar_icons
      icon: mdi:lamps
      name: Lights
      variables:
        path: /new-dash/lights
      tap_action:
        action: navigate
        navigation_path: /new-dash/lights
      card_mod:
        class: nav-btn

    - type: custom:button-card
      template: nav_bar_icons
      icon: mdi:fan
      name: Fans
      variables:
        path: /new-dash/fans
      tap_action:
        action: navigate
        navigation_path: /new-dash/fans
      card_mod:
        class: nav-btn

    - type: custom:button-card
      template: nav_bar_icons
      icon: mdi:blinds-horizontal
      name: Shades
      variables:
        path: /new-dash/covers
      tap_action:
        action: navigate
        navigation_path: /new-dash/covers
      card_mod:
        class: nav-btn

    - type: custom:button-card
      template: nav_bar_icons
      icon: mdi:cctv
      name: Cameras
      variables:
        path: /new-dash/camera
      tap_action:
        action: navigate
        navigation_path: /new-dash/camera
      card_mod:
        class: nav-btn

    - type: custom:button-card
      template: nav_bar_icons
      icon: mdi:dots-horizontal
      name: More
      variables:
        path: /new-dash/more
      tap_action:
        action: navigate
        navigation_path: /new-dash/more
      card_mod:
        class: nav-btn
