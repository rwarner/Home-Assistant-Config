type: conditional
conditions:
- condition: state
  entity: binary_sensor.battery_warning
  state: "on"
card:
  type: custom:auto-entities
  show_empty: false
  card:
    type: entities
    title: Battery Warning
  filter:
    exclude:
      - entity_id: "sensor.*iphone*"
      - entity_id: "sensor.*ipad*"
      - entity_id: "sensor.*smartshunt*"
      - entity_id: "sensor.*simulator*"
    include:
      - entity_id: "sensor.*_battery_level"
        state: "< 35"
      - entity_id: "sensor.*_battery_level"
        state: "unavailable"
