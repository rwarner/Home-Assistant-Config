            # ═══════════════════════════════════════
            # ROW 5: Dynamic Bottom Row — Alerts > Laundry > Helper Buttons
            # ═══════════════════════════════════════

            # Alarm Armed — overrides bottom row
            - type: conditional
              conditions:
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state_not: disarmed
              card:
                type: alarm-panel
                states:
                  - arm_away
                entity: alarm_control_panel.alarmo

            # Doors Open — overrides bottom row
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.exterior_doors
                  state: "on"
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state: disarmed
              card:
                type: custom:mushroom-template-card
                primary: "Exterior Door Open"
                icon: mdi:door-open
                icon_color: red
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      --card-primary-font-size: 18px;
                      padding: 4px 12px;
                      background: #FFEBEE;
                      border-radius: 16px;
                      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                    }
                    .primary { color: #B33A3A !important; }

            # Windows Open — overrides bottom row
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.house_windows
                  state: "on"
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state: disarmed
                - condition: state
                  entity: binary_sensor.exterior_doors
                  state: "off"
              card:
                type: custom:mushroom-template-card
                primary: >
                  {{ expand(state_attr('binary_sensor.house_windows', 'entity_id')) | selectattr('state', 'eq', 'on') | list | count }} Window{{ 's' if expand(state_attr('binary_sensor.house_windows', 'entity_id')) | selectattr('state', 'eq', 'on') | list | count > 1 else '' }} Open
                icon: mdi:window-open-variant
                icon_color: cyan
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      --card-primary-font-size: 18px;
                      padding: 4px 12px;
                      background: #E3F2FD;
                      border-radius: 16px;
                      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                    }
                    .primary { color: #2C5F8A !important; }

            # Package — overrides bottom row
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.doorbell_package_detected
                  state: "on"
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state: disarmed
                - condition: state
                  entity: binary_sensor.exterior_doors
                  state: "off"
                - condition: state
                  entity: binary_sensor.house_windows
                  state: "off"
              card:
                type: custom:mushroom-template-card
                primary: "Package at front door"
                icon: mdi:package-variant
                icon_color: pink
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      --card-primary-font-size: 18px;
                      padding: 4px 12px;
                      background: #F3E8F0;
                      border-radius: 16px;
                      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                    }
                    .primary { color: #5E4060 !important; }

            # Laundry — shows when active and no alerts
            - type: conditional
              conditions:
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state: disarmed
                - condition: state
                  entity: binary_sensor.exterior_doors
                  state: "off"
                - condition: state
                  entity: binary_sensor.house_windows
                  state: "off"
                - condition: state
                  entity: binary_sensor.doorbell_package_detected
                  state: "off"
                - condition: or
                  conditions:
                    - condition: state
                      entity: sensor.washer_washer_machine_state
                      state_not: unavailable
                    - condition: state
                      entity: input_boolean.washer_recently_done
                      state: 'on'
                    - condition: state
                      entity: sensor.dryer_dryer_machine_state
                      state_not: unavailable
                    - condition: state
                      entity: input_boolean.dryer_recently_done
                      state: 'on'
              card:
                type: horizontal-stack
                cards:
                  - type: custom:button-card
                    entity: sensor.washer_remaining_time
                    triggers_update:
                      - sensor.time
                    show_name: true
                    show_state: false
                    show_icon: true
                    icon: mdi:washing-machine
                    layout: icon_name
                    name: |
                      [[[
                        var machine = states['sensor.washer_washer_machine_state'];
                        if (machine && machine.state === 'run') {
                          var text = entity.state;
                          var mins = 0;
                          var hm = text.match(/(\d+)\s*hour/);
                          var mm = text.match(/(\d+)\s*minute/);
                          if (hm) mins += parseInt(hm[1]) * 60;
                          if (mm) mins += parseInt(mm[1]);
                          if (mins > 0) {
                            var est = Math.round(mins * 1.3);
                            return 'Washer: ~' + est + ' min';
                          }
                          return 'Washer: ' + text;
                        }
                        if (machine && machine.state === 'pause') return 'Washer: Paused';
                        var done = states['input_boolean.washer_recently_done'];
                        if (done && done.state === 'on') {
                          var changed = new Date(done.last_changed);
                          var mins = Math.round((Date.now() - changed.getTime()) / 60000);
                          if (mins < 1) return 'Washer: Just Done';
                          if (mins < 60) return 'Washer: Done ' + mins + 'm ago';
                          return 'Washer: Done';
                        }
                        return 'Washer: Done';
                      ]]]
                    styles:
                      card:
                        - padding: 20px 16px
                        - background: |
                            [[[
                              var st = states['sensor.washer_washer_machine_state'];
                              if (st && st.state === 'run') return '#E3F2FD';
                              if (st && st.state === 'pause') return '#F3E8F0';
                              return '#E0F2F1';
                            ]]]
                        - border-radius: 16px
                        - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                        - border: |
                            [[[
                              var st = states['sensor.washer_washer_machine_state'];
                              if (st && st.state === 'run') return '1px solid #90C2F0';
                              if (st && st.state === 'pause') return '1px solid #CDA8C0';
                              return '1px solid #A0D4CC';
                            ]]]
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: min-content auto
                        - justify-content: center
                        - column-gap: 8px
                      icon:
                        - width: 36px
                        - color: |
                            [[[
                              var st = states['sensor.washer_washer_machine_state'];
                              if (st && st.state === 'run') return '#5E9ACF';
                              if (st && st.state === 'pause') return '#A87898';
                              return '#5BA89E';
                            ]]]
                      name:
                        - font-size: 28px
                        - font-weight: bold
                        - color: '#2D3142'
                        - justify-self: start
                  - type: custom:button-card
                    entity: sensor.dryer_remaining_time
                    triggers_update:
                      - sensor.time
                    show_name: true
                    show_state: false
                    show_icon: true
                    icon: mdi:tumble-dryer
                    layout: icon_name
                    name: |
                      [[[
                        var machine = states['sensor.dryer_dryer_machine_state'];
                        if (machine && machine.state === 'run') {
                          var text = entity.state;
                          var mins = 0;
                          var hm = text.match(/(\d+)\s*hour/);
                          var mm = text.match(/(\d+)\s*minute/);
                          if (hm) mins += parseInt(hm[1]) * 60;
                          if (mm) mins += parseInt(mm[1]);
                          if (mins > 0) return 'Dryer: ' + mins + ' min';
                          return 'Dryer: ' + text;
                        }
                        if (machine && machine.state === 'pause') return 'Dryer: Paused';
                        var done = states['input_boolean.dryer_recently_done'];
                        if (done && done.state === 'on') {
                          var changed = new Date(done.last_changed);
                          var mins = Math.round((Date.now() - changed.getTime()) / 60000);
                          if (mins < 1) return 'Dryer: Just Done';
                          if (mins < 60) return 'Dryer: Done ' + mins + 'm ago';
                          return 'Dryer: Done';
                        }
                        return 'Dryer: Done';
                      ]]]
                    styles:
                      card:
                        - padding: 20px 16px
                        - background: |
                            [[[
                              var st = states['sensor.dryer_dryer_machine_state'];
                              if (st && st.state === 'run') return '#F3E8F0';
                              if (st && st.state === 'pause') return '#F3E8F0';
                              return '#E0F2F1';
                            ]]]
                        - border-radius: 16px
                        - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                        - border: |
                            [[[
                              var st = states['sensor.dryer_dryer_machine_state'];
                              if (st && st.state === 'run') return '1px solid #CDA8C0';
                              if (st && st.state === 'pause') return '1px solid #CDA8C0';
                              return '1px solid #A0D4CC';
                            ]]]
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: min-content auto
                        - justify-content: center
                        - column-gap: 8px
                      icon:
                        - width: 36px
                        - color: |
                            [[[
                              var st = states['sensor.dryer_dryer_machine_state'];
                              if (st && st.state === 'run') return '#A87898';
                              if (st && st.state === 'pause') return '#A87898';
                              return '#5BA89E';
                            ]]]
                      name:
                        - font-size: 28px
                        - font-weight: bold
                        - color: '#2D3142'
                        - justify-self: start

            # Helper buttons — show when NO alerts and NO laundry active
            - type: conditional
              conditions:
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state: disarmed
                - condition: state
                  entity: binary_sensor.exterior_doors
                  state: "off"
                - condition: state
                  entity: binary_sensor.house_windows
                  state: "off"
                - condition: state
                  entity: binary_sensor.doorbell_package_detected
                  state: "off"
                - condition: state
                  entity: sensor.washer_washer_machine_state
                  state: unavailable
                - condition: state
                  entity: input_boolean.washer_recently_done
                  state: 'off'
                - condition: state
                  entity: sensor.dryer_dryer_machine_state
                  state: unavailable
                - condition: state
                  entity: input_boolean.dryer_recently_done
                  state: 'off'
              card:
                type: horizontal-stack
                cards:
                  # Trash / Recycling week indicator
                  # Even computed week = Trash only, Odd computed week = Trash & Recycling
                  # (anchored: 2026-03-29 week 13 = Trash only)
                  # Only visible on Sunday all day and Monday before 11am
                  - type: custom:button-card
                    name: |
                      [[[
                        var d = new Date();
                        var jan4 = new Date(d.getFullYear(), 0, 4);
                        var start = new Date(jan4);
                        start.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
                        var week = Math.ceil(((d - start) / 86400000 + 1) / 7);
                        return (week % 2 !== 0) ? 'Trash & Recycling' : 'Trash Week';
                      ]]]
                    icon: |
                      [[[
                        var d = new Date();
                        var jan4 = new Date(d.getFullYear(), 0, 4);
                        var start = new Date(jan4);
                        start.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
                        var week = Math.ceil(((d - start) / 86400000 + 1) / 7);
                        return (week % 2 !== 0) ? 'mdi:recycle' : 'mdi:trash-can-outline';
                      ]]]
                    card_mod:
                      style: |
                        :host {
                          {% set day = now().weekday() %}
                          {% if not (day == 6 or (day == 0 and now().hour < 11)) %}
                            display: none !important;
                          {% endif %}
                        }
                    styles:
                      card:
                        - padding: 12px
                        - font-size: 18px
                        - color: '#5E6B3A'
                        - border-radius: 16px
                        - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                        - background: '#F0F4E4'
                        - border: '1px solid #C5D4A0'
                      icon:
                        - width: 36px
                        - height: 36px
                        - color: '#7A8B50'
                  # Open Shades — only when covers are closed
                  - type: custom:button-card
                    name: Open Shades
                    icon: mdi:blinds-horizontal
                    entity: cover.house_covers
                    tap_action:
                      action: call-service
                      service: cover.open_cover
                      service_data:
                        entity_id: cover.house_covers
                    card_mod:
                      style: |
                        :host {
                          {% if not is_state('cover.house_covers', 'closed') %}
                            display: none !important;
                          {% endif %}
                        }
                    styles:
                      card:
                        - padding: 12px
                        - font-size: 18px
                        - color: '#2C5F8A'
                        - border-radius: 16px
                        - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                        - background: '#E3F2FD'
                        - border: '1px solid #90C2F0'
                      icon:
                        - width: 36px
                        - height: 36px
                        - color: '#5E9ACF'
                  # Close Shades — only when covers are open
                  - type: custom:button-card
                    name: Close Shades
                    icon: mdi:blinds-horizontal-closed
                    entity: cover.house_covers
                    tap_action:
                      action: call-service
                      service: cover.close_cover
                      service_data:
                        entity_id: cover.house_covers
                    card_mod:
                      style: |
                        :host {
                          {% if not is_state('cover.house_covers', 'open') %}
                            display: none !important;
                          {% endif %}
                        }
                    styles:
                      card:
                        - padding: 12px
                        - font-size: 18px
                        - color: '#2C6B65'
                        - border-radius: 16px
                        - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                        - background: '#E0F2F1'
                        - border: '1px solid #A0D4CC'
                      icon:
                        - width: 36px
                        - height: 36px
                        - color: '#5BA89E'
                  # Goodnight — only after dark
                  - type: custom:button-card
                    name: Goodnight
                    icon: mdi:weather-night
                    entity: input_boolean.dark_outside
                    tap_action:
                      action: call-service
                      service: script.goodnight_routine
                    card_mod:
                      style: |
                        :host {
                          {% if not is_state('input_boolean.dark_outside', 'on') %}
                            display: none !important;
                          {% endif %}
                        }
                    styles:
                      card:
                        - padding: 12px
                        - font-size: 18px
                        - color: '#2C6B65'
                        - border-radius: 16px
                        - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                        - background: '#E0F2F1'
                        - border: '1px solid #A0D4CC'
                      icon:
                        - width: 36px
                        - height: 36px
                        - color: '#5BA89E'

