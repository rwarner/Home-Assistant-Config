# ═══════════════════════════════════════════════════════════════════════════
# Kitchen tablet dashboard — Fire HD 10 (KFTRWI), Fully Kiosk, Chrome 138 /
# Android 9 WebView, 1280x799, ~2 GB RAM.
#
# CAMERA CARDS: the option set below is load-bearing. Every `custom:webrtc-camera`
# card in this file MUST keep it, or the tablet renders black boxes with no error.
# Line refs are to custom_components/webrtc/www/ (AlexxIT WebRTC Camera v3.6.1).
#
#   mode:           `webrtc,mjpeg` — chosen for latency. WebRTC is real-time by
#     webrtc,mjpeg  design (no jitter buffer to fill), and pinning it skips the
#                   MSE pipeline entirely: no MediaSource, no SourceBuffer, and
#                   no 2 MB JS ring buffer per card (video-rtc.js:469). Left
#                   unset, video-rtc.js:353-367 opens MSE **and** WebRTC on every
#                   card at once and only picks a winner in onpcvideo — double
#                   the pipelines and double the network during page load, which
#                   on 2 GB of RAM is exactly when it stutters.
#
#                   The comma form is required: video-rtc.js:351-381 is an
#                   if/else-if chain gated on `this.mode.indexOf(...)`, so bare
#                   `mode: webrtc` would also delete the mjpeg fallback
#                   (video-rtc.js:369-376). Never `mode: hls` — that branch needs
#                   canPlayType('application/vnd.apple.mpegurl'), which is
#                   Safari-only, so on this WebView the modes array comes out
#                   EMPTY and the card never requests anything at all. Never bare
#                   `mode: mse` either: one transport, zero fallback.
#
#                   Verified reachable: go2rtc listens on UDP/TCP 8555 and the
#                   tablet (192.168.2.x) registers `webrtc` host consumers
#                   against 192.168.1.22 — cross-VLAN is not blocked.
#
#   intersection: 0 Stops the IntersectionObserver (video-rtc.js:276-285) from
#                   tearing down cards that scroll out of the 100vh panel.
#                   Use this rather than `background: true` — background also
#                   makes disconnectedCallback a permanent no-op
#                   (video-rtc.js:221, 264), so the conditional cards below would
#                   leak a live WebSocket every time they flip. Unquoted 0:
#                   webrtc-camera.js:15 compares with ===.
#
#   NO `poster:`    Do not add it. The card signs the poster URL with
#                   auth/sign_path (webrtc-camera.js:154-155) and passes no
#                   `expires`, so HA's 30-second default applies
#                   (components/auth/__init__.py, `vol.Optional("expires",
#                   default=30)`). validate_signed_request() then rejects the
#                   expired JWT and the endpoint 401s. On a wall tablet that
#                   idles for hours, any later poster fetch shows a
#                   broken-image icon — strictly worse than plain black.
#
#   NOT `conditional`  Never wrap a webrtc-camera in a `conditional` card here.
#                   Hide it with a card_mod `:host { display: none }` template
#                   instead, so the card is always mounted. See the ROW 2
#                   comment below for the cold-load deadlock this avoids.
#
#   media: video    Grid cards only. Drops audio negotiation and tips the
#                   transport race toward WebRTC in onpcvideo
#                   (video-rtc.js:576-611). Left off the doorbell cards so the
#                   doorbell stays audible.
#
# To check playback without touching the tablet, run this on the HA host:
#   curl -s http://127.0.0.1:1984/api/streams
# A camera with no `consumers` entry never negotiated; a black card that DOES
# have a consumer is a decode problem instead. Confirmed working over `webrtc`
# from the tablet at 192.168.2.24 — cross-VLAN is not blocked.
#
# YAML dashboard edits do not reach the kiosk on a plain refresh; run
# script.reload_yaml_dashboards (or browser_mod.navigate to remount a view).
# ═══════════════════════════════════════════════════════════════════════════

kiosk_mode:
  hide_header: true
  hide_sidebar: true

views:
  - path: home
    title: Kitchen Tablet
    icon: mdi:tablet
    type: panel
    background: "#F2F4F8"
    cards:
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              padding: 8px 16px;
              background: '#F2F4F8';
              box-shadow: none;
              height: 100vh;
              display: flex;
              flex-direction: column;
              border-radius: 0;
            }
        card:
          type: vertical-stack
          cards:

            # ═══════════════════════════════════════
            # ROW 1: Status Bar
            # ═══════════════════════════════════════
            - type: grid
              columns: 5
              square: false
              cards:
                - type: custom:button-card
                  entity: sensor.time
                  show_name: true
                  show_icon: false
                  show_state: false
                  name: "[[[ return new Date().toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}); ]]]"
                  styles:
                    card:
                      - padding: 10px 6px
                      - height: 68px
                      - display: flex
                      - align-items: center
                      - justify-content: center
                      - background: white
                      - border: '1px solid #C8CBD4'
                      - border-radius: 28px
                      - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                    name:
                      - font-size: 26px
                      - font-weight: 700
                      - color: '#2D3142'
                - type: custom:button-card
                  entity: sensor.time
                  show_name: true
                  show_icon: false
                  show_state: false
                  name: "[[[ return new Date().toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'}); ]]]"
                  styles:
                    card:
                      - padding: 10px 6px
                      - height: 68px
                      - display: flex
                      - align-items: center
                      - justify-content: center
                      - background: white
                      - border: '1px solid #C8CBD4'
                      - border-radius: 28px
                      - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                    name:
                      - font-size: 26px
                      - font-weight: 700
                      - color: '#2D3142'
                - type: custom:button-card
                  entity: weather.tomorrow_io_home_daily
                  show_name: true
                  show_icon: true
                  show_state: false
                  icon: |
                    [[[
                      var c = entity.state;
                      if (c === 'sunny') return 'mdi:weather-sunny';
                      if (c === 'rainy') return 'mdi:weather-rainy';
                      if (c === 'snowy') return 'mdi:weather-snowy';
                      if (c === 'partlycloudy') return 'mdi:weather-partly-cloudy';
                      return 'mdi:weather-cloudy';
                    ]]]
                  name: |
                    [[[
                      var c = entity.state.replace('partlycloudy','Ptly Cld').replace('cloudy','Cloudy').replace('sunny','Sunny').replace('rainy','Rainy').replace('snowy','Snowy');
                      return c.charAt(0).toUpperCase() + c.slice(1) + ' · ' + entity.attributes.humidity + '%';
                    ]]]
                  styles:
                    card:
                      - padding: 6px
                      - height: 68px
                      - display: flex
                      - align-items: center
                      - justify-content: center
                      - background: '#F3E8F0'
                      - border: '1px solid #CDA8C0'
                      - border-radius: 28px
                      - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                    name:
                      - font-size: 22px
                      - font-weight: 600
                      - color: '#5E4060'
                    icon:
                      - width: 24px
                      - color: '#A87898'
                - type: custom:button-card
                  entity: sun.sun
                  show_name: true
                  show_icon: true
                  show_state: false
                  icon: mdi:weather-sunset-down
                  name: |
                    [[[
                      var d = new Date(entity.attributes.next_setting);
                      return d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
                    ]]]
                  styles:
                    card:
                      - padding: 6px
                      - height: 68px
                      - display: flex
                      - align-items: center
                      - justify-content: center
                      - background: '#E0F2F1'
                      - border: '1px solid #A0D4CC'
                      - border-radius: 28px
                      - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                    name:
                      - font-size: 22px
                      - font-weight: 600
                      - color: '#2C6B65'
                    icon:
                      - width: 24px
                      - color: '#5BA89E'
                - type: custom:button-card
                  entity: sun.sun
                  show_name: true
                  show_icon: true
                  show_state: false
                  icon: mdi:weather-sunset-up
                  name: |
                    [[[
                      var d = new Date(entity.attributes.next_rising);
                      return d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
                    ]]]
                  styles:
                    card:
                      - padding: 6px
                      - height: 68px
                      - display: flex
                      - align-items: center
                      - justify-content: center
                      - background: '#E8F5E9'
                      - border: '1px solid #A0D0A4'
                      - border-radius: 28px
                      - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                    name:
                      - font-size: 22px
                      - font-weight: 600
                      - color: '#2E6B4A'
                    icon:
                      - width: 24px
                      - color: '#5BA97A'

            # NOTE: there is deliberately NO separate fullscreen doorbell card
            # here any more. It used to be a `conditional` wrapping a second
            # copy of the doorbell camera, and it was permanently broken: HA's
            # conditional card creates its child eagerly and only toggles
            # `display`, so that camera hit the cold-load deadlock described
            # below at page load and never recovered. When the boolean flipped
            # it just un-hid an already-dead card — stuck "Loading.." exactly
            # when someone was at the door.
            #
            # Instead, ROW 2 below grows the single main doorbell tile to full
            # width by hiding the info column. One camera element, one stream,
            # no conditional, nothing that can deadlock.
            # ═══════════════════════════════════════
            # ROW 2: Main Content — Camera | Big Info
            # ═══════════════════════════════════════
            # Camera — swaps to the package cam when one is detected.
            #
            # Both cameras are plain, always-mounted children of this stack, and
            # the swap is done by hiding one from the STACK's card_mod, not by a
            # `conditional` card and not by a `:host` rule on the camera itself.
            #
            #  - Not `conditional`: a webrtc-camera inside one never starts on a
            #    cold page load. HA attaches the child before assigning `hass`,
            #    onconnect() bails at `if (!this.config || !this.hass) return
            #    false` (webrtc-camera.js:141), and the `hass` setter does NOT
            #    retry — its `this.onconnect()` call is commented out
            #    (webrtc-camera.js:76-81). Nothing re-arms it. Symptom: black on
            #    first load, fine after visiting another view and back.
            #  - Not `:host` on the camera card: card_mod's `ha-card` rules do
            #    reach these cards, but `:host` does not resolve to the
            #    <webrtc-camera> element, so the rule silently does nothing and
            #    both cameras render side by side. Verified on the tablet.
            #
            # Styling the stack's own #root container works because
            # hui-stack-card puts its children there. Use `nth-of-type`, NOT
            # `nth-child`: card_mod injects its own <style> node into #root, so
            # nth-child is shifted by one and hides the wrong camera (verified on
            # the tablet — it hid the doorbell instead of the package cam).
            # nth-of-type counts only <webrtc-camera> elements, so the injected
            # style node and the info stack are both ignored.
            #
            # NOTE: hiding does NOT park the stream, so the package cam costs a
            # second always-on WebRTC pipeline here. Tried and measured: leaving
            # `intersection: 0` off it does not help, because when the observer
            # fires its first callback on an already-hidden element the card has
            # not connected yet, so disconnectedCallback() early-returns on
            # `if (this.wsState === CLOSED && this.pcState === CLOSED)`
            # (video-rtc.js:220-222). It never schedules teardown, then connects
            # a moment later and the observer never fires again. `intersection: 0`
            # is kept on both cards so the behaviour is at least predictable.
            # To actually reclaim that stream, wrap ONLY the package camera in a
            # `conditional` — it never needs to survive a cold load, since it is
            # created at runtime when the sensor trips and `hass` is already set.
            - type: horizontal-stack
              card_mod:
                style: |
                  #root > hui-card:nth-of-type(1),
                  #root > webrtc-camera:nth-of-type(1) {
                    {% if is_state('binary_sensor.doorbell_package_detected', 'on') %}
                      display: none !important;
                    {% endif %}
                  }
                  #root > hui-card:nth-of-type(2),
                  #root > webrtc-camera:nth-of-type(2) {
                    {% if not is_state('binary_sensor.doorbell_package_detected', 'on') %}
                      display: none !important;
                    {% endif %}
                  }
                  /* Doorbell takeover: when someone is at the front door, hide
                     the info column (child 3) so the live camera grows to the
                     full row width. Replaces the old conditional fullscreen
                     card — same effect, but the camera element is never
                     unmounted, so it cannot deadlock. */
                  #root > hui-card:nth-of-type(3) {
                    {% if is_state('input_boolean.someone_at_front_door', 'on') %}
                      display: none !important;
                    {% endif %}
                  }
              cards:
                # REVERTED from `url: doorbell_scrypted` back to the entity.
                # The Scrypted rebroadcast measured 0.18s flat to first frame on
                # 2026-08-09 morning, but re-measured that evening it was 2.6-5.0s
                # — same as going direct. Scrypted's prebuffer is only warm while
                # something else is actively streaming that camera; at idle it
                # gives no advantage. The morning numbers were taken while it
                # happened to be hot, so they were not a stable property.
                #
                # It also served the HIGH channel (1600x1200) rather than this
                # entity's 960x720 — 2.8x the pixels on a 2 GB tablet — and with
                # `mode: webrtc,mjpeg` there is NO working fallback (see header),
                # so a slow WebRTC negotiation just hangs on "Loading...".
                #
                # Revisit only if Scrypted's Rebroadcast prebuffer is configured
                # to stay resident for this camera; verify with repeated cold
                # `curl /api/frame.jpeg?src=<name>` pulls spread over hours.
                - type: custom:webrtc-camera
                  entity: camera.doorbell_medium
                  muted: true
                  mode: webrtc,mse,mjpeg
                  media: video
                  intersection: 0
                  card_mod:
                    style: |
                      ha-card {
                        overflow: hidden;
                        border-radius: 16px;
                        box-shadow: 0 2px 12px rgba(0,0,0,0.1);
                      }
                - type: custom:webrtc-camera
                  entity: camera.outside_doorbell_package
                  muted: true
                  # Matches the doorbell tile above. `mjpeg` alone is not a
                  # fallback — go2rtc's mjpeg consumer only accepts JPEG/RAW and
                  # these sources are H.264, so it answers 200 with 0 bytes
                  # ("codecs not matched"). `mse` is the one that actually works.
                  mode: webrtc,mse,mjpeg
                  media: video
                  intersection: 0
                  card_mod:
                    style: |
                      ha-card {
                        overflow: hidden;
                        border-radius: 16px;
                        border: 2px solid #C0A0B5;
                        box-shadow: 0 2px 12px rgba(0,0,0,0.1);
                      }

                # Right half — big glanceable info
                - type: vertical-stack
                  cards:
                    # Big temperatures
                    - type: horizontal-stack
                      cards:
                        - type: custom:button-card
                          entity: sensor.kitchen_avg_temp
                          show_name: true
                          show_state: false
                          show_icon: false
                          name: |
                            [[[
                              var k = parseFloat(states['sensor.kitchen_avg_temp'].state) || 65;
                              var l = parseFloat(states['sensor.living_room_avg_temp'].state) || 65;
                              var f = parseFloat(states['sensor.family_room_avg_temp'].state) || 65;
                              return Math.round((k + l + f) / 3) + '°';
                            ]]]
                          label: Inside
                          show_label: true
                          layout: label|name
                          tap_action:
                            action: navigate
                            navigation_path: /kitchen-tablet/climate
                          styles:
                            grid:
                              - grid-template-areas: '"n" "l"'
                              - grid-template-rows: 1fr auto
                            card:
                              - padding: 12px 0
                              - display: flex
                              - align-items: center
                              - justify-content: center
                              - background: '#E0F2F1'
                              - border: '1px solid #A0D4CC'
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                            name:
                              - font-size: 64px
                              - font-weight: bold
                              - color: '#1B6B60'
                              - justify-self: center
                            label:
                              - font-size: 20px
                              - color: '#5BA89E'
                              - justify-self: center

                        - type: custom:button-card
                          entity: sensor.outside_avg_temp
                          show_name: true
                          show_state: false
                          show_icon: false
                          name: |
                            [[[
                              return Math.round(parseFloat(entity.state)) + '°';
                            ]]]
                          label: Outside
                          show_label: true
                          layout: label|name
                          tap_action:
                            action: navigate
                            navigation_path: /kitchen-tablet/climate
                          styles:
                            grid:
                              - grid-template-areas: '"n" "l"'
                              - grid-template-rows: 1fr auto
                            card:
                              - padding: 12px 0
                              - display: flex
                              - align-items: center
                              - justify-content: center
                              - background: '#E3F2FD'
                              - border: '1px solid #90C2F0'
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                            name:
                              - font-size: 64px
                              - font-weight: bold
                              - color: '#2C5F8A'
                              - justify-self: center
                            label:
                              - font-size: 20px
                              - color: '#5E9ACF'
                              - justify-self: center

                    # Locks
                    - type: horizontal-stack
                      cards:
                        - type: custom:button-card
                          entity: lock.front_door_deadbolt
                          name: Front Door
                          show_state: true
                          show_icon: true
                          tap_action:
                            action: toggle
                          icon: |
                            [[[
                              return entity.state === 'locked' ? 'mdi:lock' : 'mdi:lock-open';
                            ]]]
                          styles:
                            card:
                              - padding: 12px
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                              - background: |
                                  [[[
                                    return entity.state === 'locked' ? '#E3F2FD' : '#F3E8F0';
                                  ]]]
                            name:
                              - font-size: 22px
                              - font-weight: bold
                              - color: '#2D3142'
                            state:
                              - font-size: 16px
                              - text-transform: capitalize
                              - color: |
                                  [[[
                                    return entity.state === 'locked' ? '#5E9ACF' : '#A87898';
                                  ]]]
                            icon:
                              - width: 32px
                              - color: |
                                  [[[
                                    return entity.state === 'locked' ? '#5E9ACF' : '#A87898';
                                  ]]]
                        - type: custom:button-card
                          entity: lock.basement_door_deadbolt
                          name: Basement
                          show_state: true
                          show_icon: true
                          tap_action:
                            action: toggle
                          icon: |
                            [[[
                              return entity.state === 'locked' ? 'mdi:lock' : 'mdi:lock-open';
                            ]]]
                          styles:
                            card:
                              - padding: 12px
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                              - background: |
                                  [[[
                                    return entity.state === 'locked' ? '#E3F2FD' : '#F3E8F0';
                                  ]]]
                            name:
                              - font-size: 22px
                              - font-weight: bold
                              - color: '#2D3142'
                            state:
                              - font-size: 16px
                              - text-transform: capitalize
                              - color: |
                                  [[[
                                    return entity.state === 'locked' ? '#5E9ACF' : '#A87898';
                                  ]]]
                            icon:
                              - width: 32px
                              - color: |
                                  [[[
                                    return entity.state === 'locked' ? '#5E9ACF' : '#A87898';
                                  ]]]

                    # Lights + Mail + Covers
                    - type: horizontal-stack
                      cards:
                        - type: custom:button-card
                          entity: light.kitchen_lights
                          show_name: true
                          show_state: false
                          show_icon: true
                          icon: mdi:lightbulb-group
                          name: |
                            [[[
                              var count = Object.values(states).filter(e =>
                                e.entity_id.startsWith('light.') &&
                                e.state === 'on' &&
                                !e.attributes.entity_id
                              ).length;
                              return count + ' Lights';
                            ]]]
                          tap_action:
                            action: navigate
                            navigation_path: /kitchen-tablet/lights
                          styles:
                            card:
                              - padding: 12px
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                              - background: '#FFF8E1'
                              - border: '1px solid #E0C050'
                            name:
                              - font-size: 24px
                              - font-weight: bold
                              - color: '#7A6520'
                            icon:
                              - width: 28px
                              - color: '#C9A830'
                        - type: custom:button-card
                          entity: input_boolean.mail_arrived
                          show_name: true
                          show_state: false
                          show_icon: true
                          icon: |
                            [[[
                              return entity.state === 'on' ? 'mdi:mailbox-up' : 'mdi:mailbox-outline';
                            ]]]
                          name: |
                            [[[
                              return entity.state === 'on' ? 'Mail!' : 'No Mail';
                            ]]]
                          tap_action:
                            action: none
                          styles:
                            card:
                              - padding: 12px
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                              - background: |
                                  [[[
                                    return entity.state === 'on' ? '#F3E8F0' : 'white';
                                  ]]]
                            name:
                              - font-size: 24px
                              - font-weight: bold
                              - color: |
                                  [[[
                                    return entity.state === 'on' ? '#5E4060' : '#B0B0B0';
                                  ]]]
                            icon:
                              - width: 28px
                              - color: |
                                  [[[
                                    return entity.state === 'on' ? '#A87898' : '#C8C8C8';
                                  ]]]
                        - type: custom:button-card
                          show_name: true
                          show_state: false
                          show_icon: true
                          icon: mdi:blinds-horizontal
                          name: |
                            [[[
                              var open = Object.values(states).filter(e =>
                                e.entity_id.startsWith('cover.') &&
                                e.state === 'open' &&
                                !e.attributes.entity_id
                              ).length;
                              if (open === 0) return 'All Closed';
                              return open + ' Shades Open';
                            ]]]
                          tap_action:
                            action: navigate
                            navigation_path: /kitchen-tablet/covers
                          styles:
                            card:
                              - padding: 12px
                              - border-radius: 16px
                              - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                              - background: '#E3F2FD'
                              - border: '1px solid #90C2F0'
                            name:
                              - font-size: 24px
                              - font-weight: bold
                              - color: '#2C5F8A'
                            icon:
                              - width: 28px
                              - color: '#5E9ACF'

                    # Energy graph
                    - type: horizontal-stack
                      cards:
                        - type: custom:mini-graph-card
                          entities:
                            - entity: sensor.home_energy_meter_gen5_electric_consumption_w_3
                              color: '#5BA89E'
                          name: Power
                          hours_to_show: 6
                          points_per_hour: 4
                          aggregate_func: max
                          line_width: 3
                          height: 40
                          font_size: 80
                          show:
                            graph: line
                            labels: false
                            name: true
                            state: true
                            icon: false
                            fill: fade
                          color_thresholds:
                            - value: 0
                              color: '#5E9ACF'
                            - value: 2000
                              color: '#5BA89E'
                            - value: 5000
                              color: '#C9A830'
                            - value: 8000
                              color: '#A87898'
                          card_mod:
                            style: |
                              ha-card {
                                background: white !important;
                                border: 1px solid #C8CBD4;
                                border-radius: 16px;
                                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                                --primary-text-color: #2D3142;
                                --secondary-text-color: #8A8FA0;
                              }
                        - type: custom:mini-graph-card
                          entities:
                            - entity: sensor.core_400s_series_pm2_5
                              color: '#5E9ACF'
                          name: Air Quality
                          hours_to_show: 6
                          points_per_hour: 10
                          aggregate_func: max
                          line_width: 3
                          height: 40
                          font_size: 80
                          show:
                            graph: line
                            labels: false
                            name: true
                            state: true
                            icon: false
                            fill: fade
                          color_thresholds:
                            - value: 0
                              color: '#5E9ACF'
                            - value: 25
                              color: '#C9A830'
                            - value: 50
                              color: '#A87898'
                          card_mod:
                            style: |
                              ha-card {
                                background: white !important;
                                border: 1px solid #C8CBD4;
                                border-radius: 16px;
                                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                                --primary-text-color: #2D3142;
                                --secondary-text-color: #8A8FA0;
                              }

