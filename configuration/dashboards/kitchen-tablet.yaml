                    - width: 28px
                    - color: >
                        [[[
                          var smoke = entity.state === 'on';
                          var co = states['binary_sensor.basement_smoke_co_alarm_carbon_monoxide_detected'] && states['binary_sensor.basement_smoke_co_alarm_carbon_monoxide_detected'].state === 'on';
                          return (smoke || co) ? '#C0584A' : '#1B6B40';
