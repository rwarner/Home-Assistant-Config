  # ═══════════════════════════════════════
  # CAMERAS VIEW
  # ═══════════════════════════════════════
  - path: cameras
    title: Cameras
    icon: mdi:cctv
    type: panel
    background: "#F2F4F8"
    cards:
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              padding: 12px 16px;
              background: '#F2F4F8';
              box-shadow: none;
              height: 100vh;
              overflow-y: auto;
              border-radius: 0;
            }
        card:
          type: vertical-stack
          cards:
            - type: custom:button-card
              name: Back
              icon: mdi:arrow-left
              layout: icon_name
              tap_action:
                action: navigate
                navigation_path: /kitchen-tablet/home
              styles:
                card:
                  - padding: 6px 14px
                  - background: white
                  - border: '1px solid #C8CBD4'
                  - border-radius: 14px
                  - box-shadow: '0 2px 8px rgba(0, 0, 0, 0.06)'
                grid:
                  - grid-template-areas: '"i n"'
                  - grid-template-columns: min-content auto
                  - justify-content: start
                  - column-gap: 6px
                name:
                  - font-size: 20px
                  - font-weight: 600
                  - color: '#2D3142'
                  - justify-self: start
                icon:
                  - width: 22px
                  - color: '#8A8FA0'

            # These cards point at the UniFi **medium** resolution channels, not
            # the high ones the home view uses. At 3 columns on a 1280 CSS-px
            # screen each cell is ~400 CSS px (~600 device px at 1.5 DPR), so a
            # 1920x1080 or 2688x1512 high stream is decoded and then thrown away
            # scaling down — roughly 16 MP per frame set across the seven.
            # camera.outside_doorbell_package is the exception: that device has
            # no medium sibling, so it stays high.
            #
            # All 7 keep the same option set — mode: webrtc,mjpeg + intersection: 0
            # + media: video. See the header of this file for why each is
            # required before editing or adding a camera here.
            - type: grid
              columns: 3
              square: false
              cards:
                - type: custom:webrtc-camera
                  entity: camera.doorbell_medium
                  muted: true
                  mode: webrtc,mse,mjpeg
                  intersection: 0
                  media: video
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid #C8CBD4;
                        border-radius: 16px;
                        overflow: hidden;
                        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
                      }
                - type: custom:webrtc-camera
                  entity: camera.outside_doorbell_package
                  muted: true
                  mode: webrtc,mse,mjpeg
                  intersection: 0
                  media: video
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid #C8CBD4;
                        border-radius: 16px;
                        overflow: hidden;
                        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
                      }
                - type: custom:webrtc-camera
                  entity: camera.nursery_medium
                  muted: true
                  mode: webrtc,mse,mjpeg
                  intersection: 0
                  media: video
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid #C8CBD4;
                        border-radius: 16px;
                        overflow: hidden;
                        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
                      }
                - type: custom:webrtc-camera
                  entity: camera.side_patio_medium
                  muted: true
                  mode: webrtc,mse,mjpeg
                  intersection: 0
                  media: video
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid #C8CBD4;
                        border-radius: 16px;
                        overflow: hidden;
                        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
                      }
                - type: custom:webrtc-camera
                  entity: camera.mid_yard_medium
                  muted: true
                  mode: webrtc,mse,mjpeg
                  intersection: 0
                  media: video
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid #C8CBD4;
                        border-radius: 16px;
                        overflow: hidden;
                        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
                      }
                - type: custom:webrtc-camera
                  entity: camera.rear_patio_medium
                  muted: true
