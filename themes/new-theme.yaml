#
# Based off of the ios-dark-mode and flow themes, tweaked and organized
# https://github.com/basnijholt/lovelace-ios-dark-mode-theme
# https://github.com/basnijholt/lovelace-ios-themes
# https://github.com/mrcharlesiv/Flow-Premium-Home-Assistant-Experience/blob/main/flow-theme.yaml
#
new-theme:
  # --------- Colors ---------
  white: "#FFF"
  off-white: "#F1F1F1"

  almost-black: "#23232e"
  pretty-much-black: "#161616"
  off-black: "#0a0a0a"
  black: "#000"

  grey-black: "#2c2c2e"

  light-grey: "#d3d3d3"
  darker-grey: "#555555"
  dark-dark-grey: "#484848"

  ios-dark-grey-blue: "#B6B6C1"  # Apple dark mode, grey/blue
  ios-dark-blue: "#0984ff" # Apple dark mode, blue
  ios-dark-green: "#30d158" # Apple dark mode, green
  ios-dark-green-bright: "#30d257" # Apple dark mode, green brighter
  ios-dark-orange: "#FF9F09"  # Apple dark mode, orange
  
  # --------- Transparency Colors ---------
  black-transparent-5: rgba(0, 0, 0, 0.5)
  white-transparent-5: rgba(255, 255, 255, 0.5)
  light-blue-transparent-4: rgba(31, 141, 214, 0.4)

  grey-transparent-8: rgba(55, 55, 55, 0.8)
  dark-grey-transparent-9: rgba(25, 25, 25, 0.9)
  dark-grey-transparent-5: rgba(25, 25, 25, 0.5)

  ios-dark-grey-transparent-3: rgba(152, 152, 157, 0.3)  # Apple dark mode, grey, alpha 0.3
  ios-dark-orange-transparent-7: rgba(255, 159, 9, 0.7)  # Apple dark mode, orange, alpha 0.7

  # --------- Global ---------
  background-image: "center / cover no-repeat fixed url('/local/images/homekit-blue.jpg')"
  lovelace-background: var(--background-image)

  primary-color: "#FF9F09" # Having trouble setting a var for this variable
  light-primary-color: var(--ios-dark-grey-blue) # Icons on left menu 
  accent-color: var(--ios-dark-green)

  primary-background-color: var(--grey-black)
  secondary-background-color: var(--dark-grey-transparent-9)
  
  divider-color: var(--ios-dark-grey-transparent-3)

  # --------- Text ---------
  primary-text-color: var(--white)
  secondary-text-color: var(--light-grey)
  text-primary-color: var(--white)
  disabled-text-color: var(--darker-grey)  # XXX: https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/2
  text-dark-color: var(--white)
  
  # --------- Sidebar Menu ---------
  sidebar-background-color: var(--primary-background-color)
  sidebar-icon-color: var(--light-primary-color)
  sidebar-text-color: var(--off-white)
  sidebar-selected-background-color: var(--primary-background-color)
  sidebar-selected-icon-color: var(--white)
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  
  # --------- States and Badges ---------
  state-icon-color: var(--white)
  state-icon-active-color: var(--white) # Or make light icons yellow when active: rgba(255, 214, 10, 1)
  state-icon-unavailable-color: var(--disabled-text-color)
  paper-item-icon-active-color: var(--white) # see https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/30
  
  # --------- Sliders ---------
  paper-slider-knob-color: var(--white)
  paper-slider-knob-start-color: var(--paper-slider-knob-color)
  paper-slider-pin-color: var(--paper-slider-knob-color)
  paper-slider-active-color: var(--ios-dark-blue)
  paper-slider-secondary-color: var(--paper-slider-knob-color)
  paper-slider-container-color: var(--white-transparent-5)
  paper-slider-font-color: var(--black)
  ha-slider-background: none !important
  
  # --------- Labels ---------
  label-badge-background-color: var(--almost-black)
  label-badge-text-color: var(--off-white)
  label-badge-red: var(--ios-dark-orange-transparent-7)
  
  # --------- Cards ---------
  card-background-color: var(--secondary-background-color)
  paper-listbox-background-color: var(--primary-background-color)
  ha-card-border-radius: 16px
  ha-card-background: rgba(15, 15, 20, 0.55)
  ha-card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25)
  paper-card-background-color: var(--ha-card-background)
  rgb-card-background-color: var(--off-black) # see https://github.com/basnijholt/lovelace-ios-themes/issues/60
  ha-card-border-width: 0
  
  # --------- Toggles ---------
  paper-toggle-button-checked-button-color: var(--dark-dark-grey)
  paper-toggle-button-checked-bar-color: var(--dark-dark-grey)
  paper-toggle-button-unchecked-button-color: var(--paper-toggle-button-checked-button-color)
  paper-toggle-button-unchecked-bar-color: var(--disabled-text-color)
  
  # --------- Table row ---------
  table-row-background-color: var(--primary-background-color)
  table-row-alternative-background-color: var(--secondary-background-color)
  
  # --------- Switches ---------
  switch-checked-track-color: var(--ios-dark-green)
  switch-checked-button-color: var(--ios-dark-green-bright) # Includes the dot on the switch, slightly brighter than the track color above

  # --------- Other ---------
  paper-dialog-background-color: var(--grey-transparent-8)  # e.g., background of more-info
  paper-item-icon-color: white  # also should mini-media-player icon white (but doesn't work by itself)
  more-info-header-background: var(--dark-grey-transparent-5)
  lumo-body-text-color: var(--primary-text-color)  # see https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/42
  app-header-background-color: var(--light-blue-transparent-4) # Background of tabs at the top, light blue
  markdown-code-background-color: var(--dark-dark-grey)
  code-editor-background-color: var(--pretty-much-black)
  clear-background-color: var(--ha-card-background)  # see https://github.com/basnijholt/lovelace-ios-themes/issues/64
  

  # --------- Mini Media Player ---------
  mini-media-player-base-color: var(--white)
  mini-media-player-icon-color: var(--white)
  mini-media-player-accent-color: var(--ios-dark-green)
  mini-media-player-name-font-weight: 600

  # --------- Mushroom ---------
  mush-card-primary-font-size: 14px
  mush-card-secondary-font-size: 12px
  mush-card-primary-font-weight: 600
  mush-card-secondary-color: var(--light-grey)
  mush-chip-border-radius: 20px
  mush-chip-padding: 0 10px
  mush-chip-height: 36px
  mush-chip-background: rgba(255, 255, 255, 0.1)

  # --------- Custom ---------
  mcg-title-letter-spacing: .05em
  input-ink-color: var(--primary-text-color)
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-label-ink-color: var(--primary-text-color)
  input-disabled-ink-color: var(--disabled-text-color)
  input-dropdown-icon-color: var(--primary-text-color)
  input-idle-line-color: var(--secondary-text-color)
  input-hover-line-color: var(--secondary-text-color)
  codemirror-property: var(--accent-color)

  # --------- Web Awesome Form Inputs (HA 2026.4+) ---------
  # New ha-input component replaced ha-textfield; reads these instead of mdc-* vars
  ha-color-form-background: "#2c2c2e"
  ha-color-form-background-hover: "#3a3a3c"
  ha-color-form-background-disabled: "#1c1c1e"

  # --------- MDC Selects/Inputs (HA 2024+) ---------
  mdc-select-fill-color: var(--primary-background-color)
  mdc-text-field-fill-color: var(--primary-background-color)
  mdc-select-ink-color: var(--primary-text-color)
  mdc-select-label-ink-color: var(--secondary-text-color)
  mdc-select-disabled-ink-color: var(--disabled-text-color)
  mdc-select-dropdown-icon-color: var(--primary-text-color)
  mdc-select-idle-line-color: var(--secondary-text-color)
  mdc-select-hover-line-color: var(--primary-text-color)
  mdc-select-outlined-idle-border-color: var(--divider-color)
  mdc-select-outlined-hover-border-color: var(--secondary-text-color)
  mdc-text-field-ink-color: var(--primary-text-color)
  mdc-text-field-label-ink-color: var(--secondary-text-color)
  mdc-text-field-idle-line-color: var(--secondary-text-color)
  mdc-text-field-hover-line-color: var(--primary-text-color)
  mdc-text-field-outlined-idle-border-color: var(--divider-color)
  mdc-text-field-outlined-hover-border-color: var(--secondary-text-color)

  # --------- Card Mod ---------
  # Card Mod Theme Examples:
  #   - https://github.com/thomasloven/lovelace-card-mod/blob/master/test/themes/airy.yaml
  card-mod-theme: new-theme # Must have same name as parent theme

  # !!
  # When updating the theme vales below and debugging you must hard reload
  # the theme's "frontend.reload_themes" or reload specific integration with VS Code
  # !!
  card-mod-card-yaml: |
      .: |
        /* Uniform card styling — glass morphism */
        ha-card {
          background: rgba(15, 15, 20, 0.55) !important;
          backdrop-filter: blur(20px) saturate(140%);
          -webkit-backdrop-filter: blur(20px) saturate(140%);
          border: 1px solid rgba(255, 255, 255, 0.06) !important;
          border-radius: 16px !important;
          box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25) !important;
        }
        /* Opt out of the glass treatment entirely. Cards nested inside a
           vertical-stack-in-card need this or they stack a second translucent
           layer on the container's and read as grey. Replaces the same five
           declarations repeated inline on every such card. */
        /* Dual selector, per the UIX docs: :host(.plain) ha-card covers cards
           the Frontend loads inside <hui-card>; ha-card.plain covers custom
           cards with a divergent structure and cards loaded BY a custom card
           (auto-entities, vertical-stack-in-card), where UIX sets the class
           on ha-card itself rather than on the host element. */
        :host(.plain) ha-card,
        ha-card.plain {
          background: none !important;
          background-color: transparent !important;
          border: none !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
        /* Tappable. `plain` strips a card back to nothing, which is right for
           a label sitting inside a container but wrong for anything you are
           meant to press -- it reads as text. This gives back just enough to
           say "button": a surface a shade lighter than the container it sits
           on, a hairline edge, and a press response.

           The press feedback is the part that actually sells it. A static
           panel can look like a button; only something that reacts to a
           finger proves it is one. */
        /* `surface` is `tappable` without the press response: for a card that
           CONTAINS controls rather than being one -- a lock card with its own
           Lock/Unlock buttons, a select, a slider. It earns the same definition
           and inset so it does not vanish into the panel, but shrinking on
           press would promise an action the card body does not perform. The
           press feedback belongs to whatever inside it is actually pressable. */
        :host(.surface) ha-card,
        ha-card.surface,
        :host(.tappable) ha-card,
        ha-card.tappable {
          background: rgba(255, 255, 255, 0.06) !important;
          border: 1px solid rgba(255, 255, 255, 0.11) !important;
          border-radius: 14px !important;
          /* Inset from the container's edge. A button whose border runs into
             the edge of the panel it sits in reads as part of the panel; the
             gap is what separates it. Applied per button rather than as
             container padding so it travels with the class wherever it is
             used, and so the labels either side of it stay full width.

             Kept deliberately small because a horizontal margin DOUBLES at
             every internal boundary: two buttons side by side in a grid put
             3px + 3px between them on top of the grid's own gap, while the
             outer edges get 3px. Container padding would give an even inset,
             but it would have to be repeated on every section instead of
             riding along with the class. */
          margin: 2px 3px !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          transition: background 120ms ease, transform 120ms ease !important;
        }
        :host(.tappable) ha-card:active,
        ha-card.tappable:active {
          background: rgba(255, 255, 255, 0.14) !important;
          transform: scale(0.97);
        }
        /* Bottom nav buttons. The background has to come through a custom
           property: button-card writes styles.card as a plain inline style,
           and the glass rule above is !important, which beats inline. So the
           active-tab pill was never rendering. */
        :host(.nav-btn) ha-card,
        ha-card.nav-btn {
          background: var(--nav-active-bg, transparent) !important;
          border: none !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          transition: background 220ms ease !important;
        }
        /* Top nav chip centering */
        :host(.top-nav-icons) ha-card {
          --chip-padding: 0px 10px;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
        :host(.top-nav-icons) .chip-container {
          justify-content: center !important;
          gap: 10px !important;
        }
  card-mod-view-yaml: |
      .: |
        hui-view {
          padding-top: 4px !important;
          --masonry-view-card-margin: 4px 8px;
        }
        